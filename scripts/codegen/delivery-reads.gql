query ReadDeliveryContext($uid: String!, $requestId: String!) @auth(level: NO_ACCESS) {
  membership(key: { uid: $uid }) {
    uid
    businessId
    role
    salonAccesses_on_membership {
      locationId
    }
  }
  replenishmentRequest(id: $requestId) {
    id
    businessId
    salonId
    state
    revision
    replacementIssueId
    salon {
      kind
      businessId
    }
    items: requestItems_on_request(orderBy: { productId: ASC }, limit: 6) {
      id
      productId
      quantity
      product {
        businessId
        inventories_on_product {
          locationId
          onHand
          reserved
          version
        }
      }
      transferItem: transferItem_on_requestItem {
        requestItemId
        quantity
        dispatchedQuantity
        receivedQuantity
      }
    }
    transfer: transfer_on_request {
      requestId
      businessId
      warehouseId
      destinationId
    }
    receipt: deliveryReceipt_on_request {
      id
      requestId
      recordedAt
      actorUid
      origin
      legacyActionReceiptId
      description
      batchIdentifier
      rootIssueId
      items: deliveryReceiptItems_on_receipt(orderBy: { productId: ASC }, limit: 6) {
        productId
        goodQuantity
        damagedQuantity
        missingQuantity
        product {
          name
        }
      }
      procedureReferences: deliveryReceiptProcedures_on_receipt(orderBy: { kind: ASC }, limit: 2) {
        kind
        versionId
        chunkId
      }
      rootIssue {
        id
        status
        revision
      }
    }
    replacementIssue {
      id
      rootRequestId
      salonId
      status
      revision
      createdAt
      salon {
        name
      }
      items: deliveryIssueItems_on_issue(orderBy: { productId: ASC }, limit: 6) {
        productId
        initialAffectedQuantity
        replacementAcceptedQuantity
        product {
          name
        }
      }
      activeReplacement: activeReplacementRequest {
        id
        state
        createdAt
      }
      businessId
      activeReplacementRequestId
    }
  }
}
query ReadDeliveryKey($uid: String!, $businessId: String!, $key: String!) @auth(level: NO_ACCESS) {
  deliveryActionKey(key: { businessId: $businessId, actorUid: $uid, idempotencyKey: $key }) {
    payloadHash
    command {
      id
      businessId
      actorUid
      type
      target
      payloadHash
      result
    }
  }
}

query ReadReplacementSlots($businessId: String!, $salonId: String!, $productIds: [String!]!)
@auth(level: NO_ACCESS) {
  activeRequests(
    where: {
      businessId: { eq: $businessId }
      salonId: { eq: $salonId }
      productId: { in: $productIds }
    }
    orderBy: { productId: ASC }
    limit: 6
  ) {
    productId
    requestId
  }
}
query ReadIssueContext($uid: String!, $issueId: String!) @auth(level: NO_ACCESS) {
  membership(key: { uid: $uid }) {
    uid
    businessId
    role
    salonAccesses_on_membership {
      locationId
    }
    business {
      locations_on_business(where: { kind: { eq: HQ } }, limit: 1) {
        id
      }
    }
  }
  deliveryIssue(id: $issueId) {
    id
    rootRequestId
    salonId
    status
    revision
    createdAt
    salon {
      name
    }
    items: deliveryIssueItems_on_issue(orderBy: { productId: ASC }, limit: 6) {
      productId
      initialAffectedQuantity
      replacementAcceptedQuantity
      product {
        name
      }
    }
    activeReplacement: activeReplacementRequest {
      id
      state
      createdAt
    }
    businessId
    activeReplacementRequestId
    rootReceiptId
    rootReceipt {
      id
      requestId
      recordedAt
      actorUid
      origin
      legacyActionReceiptId
      description
      batchIdentifier
      rootIssueId
      items: deliveryReceiptItems_on_receipt(orderBy: { productId: ASC }, limit: 6) {
        productId
        goodQuantity
        damagedQuantity
        missingQuantity
        product {
          name
        }
      }
      procedureReferences: deliveryReceiptProcedures_on_receipt(orderBy: { kind: ASC }, limit: 2) {
        kind
        versionId
        chunkId
      }
      rootIssue {
        id
        status
        revision
      }
    }
  }
}
# Admin-only primitive for verified historical backfill; never a callable command.
mutation InsertLegacyDeliveryReceipt(
  $id: String!
  $businessId: String!
  $requestId: String!
  $transferRequestId: String!
  $salonId: String!
  $actorUid: String!
  $recordedAt: Timestamp!
  $legacyActionReceiptId: String!
) @auth(level: NO_ACCESS) @transaction {
  deliveryReceipt_insert(
    data: {
      id: $id
      businessId: $businessId
      requestId: $requestId
      transferRequestId: $transferRequestId
      salonId: $salonId
      actorUid: $actorUid
      recordedAt: $recordedAt
      origin: LEGACY
      legacyActionReceiptId: $legacyActionReceiptId
    }
  )
}

query ReadDeliveryBindings($uid: String!) @auth(level: NO_ACCESS) {
  membership(key: { uid: $uid }) {
    uid
    businessId
    role
    business {
      bindings: deliveryProcedureBindings_on_business(orderBy: { kind: ASC }, limit: 2) {
        kind
        documentId
        revision
        document {
          id
          businessId
          documentCode
          activeVersionId
          versions: knowledgeVersions_on_document(where: { isActive: { eq: true } }, limit: 2) {
            id
            title
            businessId
            status
            publishedAt
            revokedAt
          }
        }
      }
    }
  }
}
query ReadDeliveryProcedureDocument($businessId: String!, $documentId: String!)
@auth(level: NO_ACCESS) {
  knowledgeDocument(
    first: { where: { id: { eq: $documentId }, businessId: { eq: $businessId } } }
  ) {
    id
    businessId
    activeVersionId
    versions: knowledgeVersions_on_document(where: { isActive: { eq: true } }, limit: 2) {
      id
      title
      businessId
      status
      publishedAt
      revokedAt
    }
  }
}
