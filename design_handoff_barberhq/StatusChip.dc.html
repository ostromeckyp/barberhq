<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=swap" rel="stylesheet"></helmet>
<sc-if value="{{ isPending }}" hint-placeholder-val="{{ true }}"><span style="display:inline-flex;align-items:center;gap:6px;height:32px;box-sizing:border-box;padding:0 12px 0 8px;border-radius:8px;background:#fbefd6;color:#5c3700;font:500 14px Archivo,system-ui,sans-serif;white-space:nowrap"><span class="material-symbols-outlined" style="font-size:18px">hourglass_top</span>Pending approval</span></sc-if>
<sc-if value="{{ isApproved }}"><span style="display:inline-flex;align-items:center;gap:6px;height:32px;box-sizing:border-box;padding:0 12px 0 8px;border-radius:8px;background:#dfe6f5;color:#1f3a6b;font:500 14px Archivo,system-ui,sans-serif;white-space:nowrap"><span class="material-symbols-outlined" style="font-size:18px">lock</span>Approved · reserved</span></sc-if>
<sc-if value="{{ isDispatched }}"><span style="display:inline-flex;align-items:center;gap:6px;height:32px;box-sizing:border-box;padding:0 12px 0 8px;border-radius:8px;background:#e3ded4;color:#171614;font:500 14px Archivo,system-ui,sans-serif;white-space:nowrap"><span class="material-symbols-outlined" style="font-size:18px">local_shipping</span>Dispatched</span></sc-if>
<sc-if value="{{ isReceived }}"><span style="display:inline-flex;align-items:center;gap:6px;height:32px;box-sizing:border-box;padding:0 12px 0 8px;border-radius:8px;background:#dcebdc;color:#1f4d23;font:500 14px Archivo,system-ui,sans-serif;white-space:nowrap"><span class="material-symbols-outlined" style="font-size:18px">check_circle</span>Received</span></sc-if>
<sc-if value="{{ isRejected }}"><span style="display:inline-flex;align-items:center;gap:6px;height:32px;box-sizing:border-box;padding:0 12px 0 8px;border-radius:8px;background:#f9dedc;color:#8c1d18;font:500 14px Archivo,system-ui,sans-serif;white-space:nowrap"><span class="material-symbols-outlined" style="font-size:18px">cancel</span>Rejected</span></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:48},&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;pending&quot;,&quot;approved&quot;,&quot;dispatched&quot;,&quot;received&quot;,&quot;rejected&quot;],&quot;default&quot;:&quot;pending&quot;,&quot;tsType&quot;:&quot;'pending'|'approved'|'dispatched'|'received'|'rejected'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const s = this.props.status || 'pending';
    return { isPending: s === 'pending', isApproved: s === 'approved', isDispatched: s === 'dispatched', isReceived: s === 'received', isRejected: s === 'rejected' };
  }
}
</script>
</body>
</html>
