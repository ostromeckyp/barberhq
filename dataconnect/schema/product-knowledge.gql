enum ProductAliasKind {
  NAME
  TYPE
  PHONETIC
}
enum ProductAliasSource {
  GENERATED
  HQ
  SALON_CONFIRMED
  SEED
}
enum ProductAliasStatus {
  PROPOSED
  ACTIVE
  REJECTED
  RETIRED
}

type KnowledgeProductLink @table(key: "id") {
  id: String!
  business: Business!
  version: KnowledgeVersion!
  product: Product
  chunk: KnowledgeChunk!
  start: Int!
  end: Int!
  extractionHash: String!
  candidateProductIds: Any!
  method: String!
  confirmed: Boolean!
  createdBy: String!
  createdAt: Timestamp!
}
type KnowledgeProductProfile @table(key: ["version", "product"]) {
  business: Business!
  version: KnowledgeVersion!
  product: Product!
  proposedType: String
  approvedType: String
  reviewedBy: String
  reviewedAt: Timestamp
}
type ProductAlias
  @table(key: "id")
  @unique(fields: ["sourceDocumentVersion", "product", "kind", "normalized", "lang", "source"]) {
  id: String!
  business: Business!
  product: Product!
  salon: Location
  phrase: String!
  normalized: String!
  kind: ProductAliasKind!
  lang: String!
  source: ProductAliasSource!
  status: ProductAliasStatus!
  ambiguous: Boolean!
  sourceDocumentVersion: KnowledgeVersion
  createdBy: String!
  createdAt: Timestamp!
  reviewedBy: String
  reviewedAt: Timestamp
  generationId: String
  revision: Int! @default(value: 1)
  "True when HQ edited or removed this SEED row; the seed never reactivates it."
  overriddenByHq: Boolean! @default(value: false)
}
type ProductKnowledgeOperation
  @table(key: "id")
  @unique(fields: ["business", "actorUid", "idempotencyKey"]) {
  id: String!
  business: Business!
  version: KnowledgeVersion!
  actorUid: String!
  idempotencyKey: String!
  action: String!
  payloadHash: String!
  result: Any
  generationId: String
  leaseExpiresAt: Timestamp
  completedAt: Timestamp
  createdAt: Timestamp!
}
# Server-only binding of one final clarification to the extracted phrase; no full message is stored.
type ReplenishmentChoiceReceipt @table(key: "id") {
  id: String!
  business: Business!
  salon: Location!
  actorUid: String!
  messageHash: String!
  lineId: String!
  productQuery: String!
  aliasId: String!
  allowedProductIds: Any!
  catalogRevision: Int!
  expectedAliasRevision: Int!
  expiresAt: Timestamp!
  consumedProductId: String
  consumedAt: Timestamp
  createdAt: Timestamp!
}
# Server-only journal of salon shorthand removals, independent of document journals.
type SalonAliasOperation
  @table(key: "id")
  @unique(fields: ["business", "actorUid", "idempotencyKey"]) {
  id: String!
  business: Business!
  actorUid: String!
  idempotencyKey: String!
  action: String!
  payloadHash: String!
  result: Any!
  createdAt: Timestamp!
}
