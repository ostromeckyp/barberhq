enum DeliveryReceiptOrigin {
  RECORDED
  LEGACY
}
enum DeliveryProblemKind {
  DAMAGED
  MISSING
}
enum DeliveryIssueStatus {
  OPEN
  IN_REVIEW
  REPLACEMENT_IN_PROGRESS
  RESOLVED
}
enum DeliveryCommandType {
  RECORD_RECEIPT
  START_REVIEW
  CREATE_REPLACEMENT
  ADD_NOTE
  SET_PROCEDURE
}
enum DeliveryIssueEventType {
  OPENED
  REVIEW_STARTED
  NOTE_ADDED
  REPLACEMENT_CREATED
  REPLACEMENT_REJECTED
  REPLACEMENT_RECEIVED
}

type DeliveryReceipt @table(key: "id") @unique(fields: ["request"]) @unique(fields: ["transfer"]) {
  id: String!
  business: Business!
  request: ReplenishmentRequest!
  transfer: Transfer!
  salon: Location!
  actorUid: String!
  recordedAt: Timestamp! @default(expr: "request.time")
  origin: DeliveryReceiptOrigin!
  legacyActionReceiptId: String
  description: String
  batchIdentifier: String
  rootIssue: DeliveryIssue
}
type DeliveryReceiptItem @table(name: "delivery_item", key: ["receipt", "product"]) {
  receipt: DeliveryReceipt!
  product: Product!
  goodQuantity: Int!
  damagedQuantity: Int!
  missingQuantity: Int!
}
type DeliveryIssue
  @table(key: "id")
  @unique(fields: ["rootReceipt"])
  @index(fields: ["businessId", "status", "createdAt"]) {
  id: String!
  business: Business!
  salon: Location!
  rootReceipt: DeliveryReceipt!
  rootRequest: ReplenishmentRequest!
  status: DeliveryIssueStatus!
  revision: Int!
  activeReplacementRequest: ReplenishmentRequest
  createdAt: Timestamp! @default(expr: "request.time")
}
type DeliveryIssueItem @table(key: ["issue", "product"]) {
  issue: DeliveryIssue!
  product: Product!
  initialAffectedQuantity: Int!
  replacementAcceptedQuantity: Int! @default(value: 0)
}
type DeliveryIssueEvent @table(key: "id") @unique(fields: ["issue", "revision"]) {
  id: String!
  issue: DeliveryIssue!
  revision: Int!
  actorUid: String!
  recordedAt: Timestamp! @default(expr: "request.time")
  type: DeliveryIssueEventType!
  status: DeliveryIssueStatus!
  request: ReplenishmentRequest
  note: String
  quantities: Any!
}
type DeliveryProcedureBinding @table(key: ["business", "kind"]) {
  business: Business!
  kind: DeliveryProblemKind!
  document: KnowledgeDocument
  revision: Int!
  updatedAt: Timestamp! @default(expr: "request.time")
}
type DeliveryReceiptProcedure @table(key: ["receipt", "kind"]) {
  receipt: DeliveryReceipt!
  kind: DeliveryProblemKind!
  version: KnowledgeVersion!
  chunk: KnowledgeChunk
}
type DeliveryCommandReceipt @table(key: "id") {
  id: String!
  business: Business!
  actorUid: String!
  type: DeliveryCommandType!
  target: String!
  payloadHash: String!
  result: Any!
  createdAt: Timestamp! @default(expr: "request.time")
}
type DeliveryActionKey @table(key: ["business", "actorUid", "idempotencyKey"]) {
  business: Business!
  actorUid: String!
  idempotencyKey: String!
  command: DeliveryCommandReceipt!
  payloadHash: String!
}
