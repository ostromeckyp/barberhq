enum KnowledgeProcessingStatus {
  STAGED
  EXTRACTED
  REVIEWED
  EMBEDDED
  READY
  NEEDS_REVIEW
  FAILED
}
enum KnowledgePublicationStatus {
  DEMO_CURRENT
  RETIRED
}
enum KnowledgeDocumentKind {
  PROCEDURE
  POLICY
  PRODUCT_CARD
  PRODUCT_CATALOG
}
enum KnowledgeOrigin {
  OFFICIAL
  PUBLIC_COMPILATION
  SYNTHETIC
}
enum KnowledgeSourceType {
  SYNTHETIC_PROCEDURE
  PUBLIC_PRODUCT_SUMMARY
}
enum KnowledgePageQuality {
  COMPLETE
  NEEDS_REVIEW
}
enum KnowledgeGeometryStatus {
  VERIFIED
  UNAVAILABLE
}
enum KnowledgePendingStage {
  EXTRACT
  PUBLISH
}
enum KnowledgeOperationAction {
  CREATE
  DELETE
  REVIEW
  RETRY
}

type KnowledgeDocument @table(key: "id") @unique(fields: ["business", "documentCode"]) {
  id: String!
  business: Business!
  documentCode: String!
  activeVersionId: String
  revision: Int! @default(value: 0)
  nextVersionNumber: Int
}

type KnowledgeVersion @table(key: "id") @unique(fields: ["document", "versionLabel"]) {
  id: String!
  document: KnowledgeDocument!
  business: Business!
  versionLabel: String!
  productKnowledgeRevision: Int! @default(value: 0)
  productKnowledgeCatalogRevision: Int
  pendingProductKnowledgeRevision: Int
  pendingProductKnowledgeReviewedHash: String
  pendingProductKnowledgeCatalogRevision: Int
  productKnowledgeReviewedHash: String
  productKnowledgeState: Any
  title: String!
  language: String!
  sourceType: KnowledgeSourceType
  kind: KnowledgeDocumentKind
  origin: KnowledgeOrigin
  publicationStatus: KnowledgePublicationStatus! @default(value: DEMO_CURRENT)
  synthetic: Boolean!
  sourceUrls: Any!
  observedOn: Date
  status: KnowledgeProcessingStatus!
  revision: Int! @default(value: 1)
  bucket: String
  objectPath: String
  objectGeneration: String
  pdfSha256: String!
  contentType: String
  byteSize: Int
  pageCount: Int
  uploadedAt: Timestamp
  pendingStage: KnowledgePendingStage
  pendingDocumentRevision: Int
  pendingExtractionHash: String
  processingLeaseId: String
  processingLeaseExpiresAt: Timestamp
  parserVersion: String
  extractionHash: String
  embeddingConfigHash: String
  expectedChunkCount: Int
  reviewedBy: String
  reviewedAt: Timestamp
  reviewedPageCount: Int! @default(value: 0)
  publishedAt: Timestamp
  isActive: Boolean! @default(value: false)
  revokedAt: Timestamp
  processingError: String
  processingAttempt: Int! @default(value: 0)
  createdAt: Timestamp! @default(expr: "request.time")
}

type KnowledgeOperation
  @table(key: "id")
  @unique(fields: ["business", "actorUid", "idempotencyKey"]) {
  id: String!
  business: Business!
  actorUid: String!
  idempotencyKey: String!
  action: KnowledgeOperationAction!
  retryStage: KnowledgePendingStage
  payloadHash: String!
  documentId: String!
  versionId: String!
  completedAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
}

type KnowledgePage @table(key: ["version", "physicalPage"]) {
  version: KnowledgeVersion!
  physicalPage: Int!
  text: String!
  markdown: String!
  spans: Any!
  printedLabel: String
  quality: KnowledgePageQuality!
  reviewed: Boolean! @default(value: false)
  viewBox: Any!
  userUnit: Float!
  rotation: Int!
}

type KnowledgeChunk @table(key: "id") @unique(fields: ["version", "physicalPage", "ordinal"]) {
  id: String!
  version: KnowledgeVersion!
  physicalPage: Int!
  ordinal: Int!
  sectionId: String!
  heading: String!
  text: String!
  start: Int!
  end: Int!
  rects: Any!
  geometryStatus: KnowledgeGeometryStatus!
  embedding: Vector! @col(size: 768)
  embeddingModel: String!
  embeddingDimension: Int!
  embeddingConfigHash: String!
}
