# HQ product administration: quantity journal and idempotent command journal. Server-only.
type HqStockAdjustment @table(key: "id") {
  id: String!
  business: Business!
  product: Product!
  location: Location!
  before: Int!
  after: Int!
  actorUid: String!
  createdAt: Timestamp!
}
type ProductAdminOperation
  @table(key: "id")
  @unique(fields: ["business", "actorUid", "idempotencyKey"]) {
  id: String!
  business: Business!
  actorUid: String!
  idempotencyKey: String!
  action: String!
  payloadHash: String!
  result: Any!
  createdAt: Timestamp!
}
# Current card attached from the product screen (one per product). Suggestions are HQ-review input only.
type ProductCardAttachment @table(key: "product") {
  product: Product!
  business: Business!
  documentId: String!
  versionId: String!
  status: String!
  suggestions: Any!
  actorUid: String!
  revision: Int!
  updatedAt: Timestamp!
}
