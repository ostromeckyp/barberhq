type Business @table(key: "id") {
  id: String!
  name: String!
  productKnowledgeRevision: Int! @default(value: 0)
}
enum MemberRole {
  HQ
  SALON
}
enum LocationKind {
  HQ
  SALON
}
type Membership @table(key: "uid") {
  uid: String!
  business: Business!
  role: MemberRole!
}
type Location @table(key: "id") @unique(fields: ["business", "key"]) {
  id: String!
  business: Business!
  key: String!
  name: String!
  kind: LocationKind!
  "Salon shorthand revision; bumped whenever this salon's learned meanings change."
  productAliasRevision: Int! @default(value: 0)
}
type SalonAccess @table(key: ["membership", "location"]) {
  membership: Membership!
  location: Location!
}
type Product @table(key: "id") @unique(fields: ["business", "demoId"]) {
  id: String!
  business: Business!
  demoId: String!
  name: String!
  type: String
  typeSourceVersionId: String
  "Reviewed seed type; projected into type when no current document assertion exists."
  seedType: String
  "Reviewed seed keywords; null reads as an empty list."
  keywords: [String!]
  "Set when HQ created or edited the product in the app; seed never overwrites such fields."
  hqUpdatedAt: Timestamp
  "Per-product revision for HQ field edits (CAS), independent of catalog-wide changes."
  adminRevision: Int! @default(value: 0)
  hqUpdatedBy: String
  brand: String!
  category: String!
  summaryEn: String!
  scentPl: String
  sourceCode: String!
  netContentMl: Int!
  retailPriceGrosz: Int!
  sourceUrl: String!
  observedOn: Date!
  transferPackSize: Int
  packageDimensionsMm: Any
  shippingWeightGrams: Int
}
type Inventory @table(key: ["location", "product"]) {
  location: Location!
  product: Product!
  onHand: Int!
  reserved: Int! @default(value: 0)
  version: Int! @default(value: 1)
}

type SalonSettings @table(key: "salon") {
  salon: Location!
  lowStockThreshold: Int! @default(value: 2)
  version: Int! @default(value: 1)
  updatedAt: Timestamp! @default(expr: "request.time")
}
