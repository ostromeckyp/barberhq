query GetKnowledgeReview($versionId: String!) @auth(level: USER) {
  membership(key: { uid_expr: "auth.uid" })
    @check(
      expr: "this != null && this.role == 'HQ' && this.business.versions.size() == 1 && this.business.versions[0].pageCount != null && this.business.versions[0].pageCount >= 1 && this.business.versions[0].pageCount <= 30 && this.business.versions[0].pages.size() == this.business.versions[0].pageCount"
      message: "FORBIDDEN"
    ) {
    role @redact
    business {
      versions: knowledgeVersions_on_business(where: { id: { eq: $versionId } }, limit: 1) {
        id
        documentId
        businessId
        versionLabel
        title
        language
        sourceUrls
        observedOn
        sourceType
        kind
        origin
        synthetic
        publicationStatus
        isActive
        pageCount
        status
        revision
        document {
          activeVersionId
          revision
        }
        revokedAt
        pdfSha256
        publishedAt
        pendingStage
        processingError
        extractionHash
        createdAt
        pages: knowledgePages_on_version(orderBy: { physicalPage: ASC }, limit: 30) {
          physicalPage
          text
          markdown
          spans
          printedLabel
          quality
          reviewed
          viewBox
          userUnit
          rotation
        }
      }
    }
  }
}
