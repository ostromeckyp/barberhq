# Full demo reset: what the knowledge wipe would remove.
query ReadKnowledgeWipeCounts($businessId: String!) @auth(level: NO_ACCESS) {
  documents: knowledgeDocuments(where: { businessId: { eq: $businessId } }) {
    _count
  }
  versions: knowledgeVersions(where: { businessId: { eq: $businessId } }) {
    _count
  }
  chunks: knowledgeChunks(where: { version: { businessId: { eq: $businessId } } }) {
    _count
  }
  cardAttachments: productCardAttachments(where: { businessId: { eq: $businessId } }) {
    _count
  }
  documentAliases: productAliases(
    where: { businessId: { eq: $businessId }, sourceDocumentVersionId: { isNull: false } }
  ) {
    _count
  }
}

# Full demo reset: every knowledge row of the business. Deleting documents cascades to versions,
# pages, chunks, product links/profiles/operations and receipt procedure references; procedure
# bindings fall back to null (the rebuild binds the seeded procedures). Seed and HQ aliases stay.
mutation WipeDemoKnowledge($businessId: String!) @auth(level: NO_ACCESS) @transaction {
  result: _execute(
    sql: """
    WITH doc_aliases AS (
    DELETE FROM product_alias WHERE business_id=$1 AND source_document_version_id IS NOT NULL RETURNING id
    ), att AS (DELETE FROM product_card_attachment WHERE business_id=$1 RETURNING product_id),
    kops AS (DELETE FROM knowledge_operation WHERE business_id=$1 RETURNING id),
    pops AS (DELETE FROM product_knowledge_operation WHERE business_id=$1 RETURNING id),
    types AS (
    UPDATE product SET type=seed_type,type_source_version_id=NULL
    WHERE business_id=$1 AND type_source_version_id IS NOT NULL RETURNING id
    ), docs AS (
    DELETE FROM knowledge_document WHERE business_id=$1
    AND (SELECT count(*) FROM doc_aliases)>=0 AND (SELECT count(*) FROM pops)>=0 RETURNING id
    )
    UPDATE business SET product_knowledge_revision=product_knowledge_revision+1
    WHERE id=$1 AND product_knowledge_revision<2147483647
    AND (SELECT count(*) FROM docs)>=0 AND (SELECT count(*) FROM att)>=0
    AND (SELECT count(*) FROM kops)>=0 AND (SELECT count(*) FROM types)>=0
    """
    params: [$businessId]
  ) @check(expr: "this == 1", message: "STALE_STATE")
}

# Full demo reset: each seeded product card is attached to its product as published.
mutation SeedProductCardAttachment(
  $businessId: String!
  $productId: String!
  $documentId: String!
  $versionId: String!
) @auth(level: NO_ACCESS) @transaction {
  result: _execute(
    sql: """
    INSERT INTO product_card_attachment (product_id,business_id,document_id,version_id,status,suggestions,actor_uid,revision,updated_at)
    SELECT p.id,$1,$3,$4,'PUBLISHED','[]'::jsonb,'seed',1,clock_timestamp() FROM product p
    WHERE p.id=$2 AND p.business_id=$1
    AND EXISTS(SELECT 1 FROM knowledge_version v WHERE v.id=$4 AND v.document_id=$3 AND v.business_id=$1)
    ON CONFLICT (product_id) DO UPDATE SET document_id=EXCLUDED.document_id,version_id=EXCLUDED.version_id,
    status=EXCLUDED.status,suggestions=EXCLUDED.suggestions,actor_uid=EXCLUDED.actor_uid,
    revision=product_card_attachment.revision+1,updated_at=EXCLUDED.updated_at
    """
    params: [$businessId, $productId, $documentId, $versionId]
  ) @check(expr: "this == 1", message: "STALE_STATE")
}

# Full demo reset: each delivery problem kind is bound to its seeded procedure.
mutation SeedDeliveryProcedureBindings(
  $businessId: String!
  $bindingsJson: String!
  $expectedCount: Int!
) @auth(level: NO_ACCESS) @transaction {
  result: _execute(
    sql: """
    INSERT INTO delivery_procedure_binding (business_id,kind,document_id,revision,updated_at)
    SELECT $1,x.kind::delivery_problem_kind,x.document_id,1,clock_timestamp()
    FROM jsonb_to_recordset($2::jsonb) AS x(kind text, document_id text)
    WHERE EXISTS(SELECT 1 FROM knowledge_document d WHERE d.id=x.document_id AND d.business_id=$1)
    ON CONFLICT (business_id,kind) DO UPDATE SET document_id=EXCLUDED.document_id,
    revision=delivery_procedure_binding.revision+1,updated_at=EXCLUDED.updated_at
    """
    params: [$businessId, $bindingsJson]
  ) @check(expr: "this == vars.expectedCount", message: "STALE_STATE")
}
