# Only verified Cloud Functions and operator tooling may invoke these operations.
query StockContext($uid:String!, $requestId:String, $salonId:String, $productId:String, $key:String!, $action:StockActionType!) @auth(level:NO_ACCESS) {
  membership(key:{uid:$uid}) { uid businessId role salonAccesses_on_membership { locationId }
    business { locations_on_business(where:{kind:{eq:HQ}},limit:1) { id } }
  }
  replenishmentRequest(first:{where:{id:{eq:$requestId}}}) { id businessId salonId productId quantity state revision
    product { inventories_on_product { locationId onHand reserved version } }
  }
  product(first:{where:{id:{eq:$productId}}}) { id businessId inventories_on_product { locationId onHand reserved version } }
  location(first:{where:{id:{eq:$salonId}}}) { id businessId kind }
  keyed: actionKeys(where:{actorUid:{eq:$uid},idempotencyKey:{eq:$key}},limit:1) {
    payloadHash receipt { id businessId requestId actorUid action payloadHash semanticHash state revision }
  }
  semantic: actionReceipts(where:{requestId:{eq:$requestId},action:{eq:$action}},limit:1) {
    id businessId requestId actorUid action payloadHash semanticHash state revision
  }
  activeRequests(where:{salonId:{eq:$salonId},productId:{eq:$productId}},limit:1) { requestId }
}

mutation SubmitStock($uid:String!, $businessId:String!, $salonId:String!, $productId:String!, $quantity:Int!, $requestId:String!, $receiptId:String!, $key:String!, $payloadHash:String!, $semanticHash:String!) @auth(level:NO_ACCESS) @transaction {
  query @redact {
    membership(key:{uid:$uid}) @check(expr:"this != null && this.businessId == vars.businessId && this.role == 'SALON' && this.salonAccesses_on_membership.exists(a, a.locationId == vars.salonId)",message:"FORBIDDEN") { businessId role salonAccesses_on_membership { locationId } }
    location(id:$salonId) @check(expr:"this != null && this.businessId == vars.businessId && this.kind == 'SALON'",message:"FORBIDDEN") { businessId kind }
    product(id:$productId) @check(expr:"this != null && this.businessId == vars.businessId && vars.quantity >= 1 && vars.quantity <= 99",message:"VALIDATION_ERROR") { businessId }
  }
  replenishmentRequest_insert(data:{id:$requestId,businessId:$businessId,salonId:$salonId,productId:$productId,quantity:$quantity,state:PENDING_APPROVAL,revision:1})
  activeRequest_insert(data:{businessId:$businessId,salonId:$salonId,productId:$productId,requestId:$requestId})
  actionReceipt_insert(data:{id:$receiptId,businessId:$businessId,actorUid:$uid,idempotencyKey:$key,requestId:$requestId,action:SUBMIT,payloadHash:$payloadHash,semanticHash:$semanticHash,state:PENDING_APPROVAL,revision:1})
  actionKey_insert(data:{businessId:$businessId,actorUid:$uid,idempotencyKey:$key,receiptId:$receiptId,payloadHash:$payloadHash})
}

mutation ApproveStock($uid:String!, $businessId:String!, $requestId:String!, $revision:Int!, $receiptId:String!, $key:String!, $payloadHash:String!, $semanticHash:String!, $inventoryVersion:Int!) @auth(level:NO_ACCESS) @transaction {
  requestGuard: query @redact {
    replenishmentRequest(id:$requestId) @check(expr:"this != null && this.businessId == vars.businessId && this.state == 'PENDING_APPROVAL' && this.revision == vars.revision",message:"STALE_STATE") { businessId salonId productId quantity state revision }
  }
  query @redact {
    membership(key:{uid:$uid}) @check(expr:"this != null && this.businessId == vars.businessId && this.role == 'HQ'",message:"FORBIDDEN") { businessId role salonAccesses_on_membership { locationId } }
    inventories(where:{location:{businessId:{eq:$businessId},kind:{eq:HQ}},productId:{eq_expr:"response.requestGuard.replenishmentRequest.productId"}},limit:1) @check(expr:"this.size() == 1 && this[0].version == vars.inventoryVersion && this[0].onHand - this[0].reserved >= response.requestGuard.replenishmentRequest.quantity",message:"STALE_STATE") { locationId productId onHand reserved version }
  }
  changed: replenishmentRequest_updateMany(where:{id:{eq:$requestId},businessId:{eq:$businessId},state:{eq:PENDING_APPROVAL},revision:{eq:$revision}},data:{state:RESERVED,revision_update:{inc:1}}) @check(expr:"this == 1",message:"STALE_STATE")
  inventory_updateMany(where:{locationId:{eq_expr:"response.query.inventories[0].locationId"},productId:{eq_expr:"response.requestGuard.replenishmentRequest.productId"},version:{eq:$inventoryVersion}},data:{version_update:{inc:1},reserved_expr:"response.query.inventories[0].reserved + response.requestGuard.replenishmentRequest.quantity"}) @check(expr:"this == 1",message:"STALE_STATE")
  transfer_insert(data:{requestId:$requestId,businessId:$businessId,warehouseId_expr:"response.query.inventories[0].locationId",destinationId_expr:"response.requestGuard.replenishmentRequest.salonId",productId_expr:"response.requestGuard.replenishmentRequest.productId",quantity_expr:"response.requestGuard.replenishmentRequest.quantity"})
  actionReceipt_insert(data:{id:$receiptId,businessId:$businessId,actorUid:$uid,idempotencyKey:$key,requestId:$requestId,action:APPROVE,payloadHash:$payloadHash,semanticHash:$semanticHash,state:RESERVED,revision_expr:"vars.revision + 1"})
  actionKey_insert(data:{businessId:$businessId,actorUid:$uid,idempotencyKey:$key,receiptId:$receiptId,payloadHash:$payloadHash})
}

mutation RejectStock($uid:String!, $businessId:String!, $requestId:String!, $revision:Int!, $receiptId:String!, $key:String!, $payloadHash:String!, $semanticHash:String!, $reason:String!) @auth(level:NO_ACCESS) @transaction {
  requestGuard: query @redact {
    replenishmentRequest(id:$requestId) @check(expr:"this != null && this.businessId == vars.businessId && this.state == 'PENDING_APPROVAL' && this.revision == vars.revision",message:"STALE_STATE") { businessId salonId productId quantity state revision }
  }
  query @redact {
    membership(key:{uid:$uid}) @check(expr:"this != null && this.businessId == vars.businessId && this.role == 'HQ'",message:"FORBIDDEN") { businessId role salonAccesses_on_membership { locationId } }
  }
  changed: replenishmentRequest_updateMany(where:{id:{eq:$requestId},businessId:{eq:$businessId},state:{eq:PENDING_APPROVAL},revision:{eq:$revision}},data:{state:REJECTED,revision_update:{inc:1}}) @check(expr:"this == 1",message:"STALE_STATE")
  activeRequest_deleteMany(where:{requestId:{eq:$requestId},businessId:{eq:$businessId}}) @check(expr:"this == 1",message:"INVALID_TRANSITION")
  actionReceipt_insert(data:{id:$receiptId,businessId:$businessId,actorUid:$uid,idempotencyKey:$key,requestId:$requestId,action:REJECT,payloadHash:$payloadHash,semanticHash:$semanticHash,state:REJECTED,revision_expr:"vars.revision + 1",reason:$reason})
  actionKey_insert(data:{businessId:$businessId,actorUid:$uid,idempotencyKey:$key,receiptId:$receiptId,payloadHash:$payloadHash})
}

mutation DispatchStock($uid:String!, $businessId:String!, $requestId:String!, $revision:Int!, $receiptId:String!, $key:String!, $payloadHash:String!, $semanticHash:String!, $inventoryVersion:Int!) @auth(level:NO_ACCESS) @transaction {
  requestGuard: query @redact {
    replenishmentRequest(id:$requestId) @check(expr:"this != null && this.businessId == vars.businessId && this.state == 'RESERVED' && this.revision == vars.revision",message:"STALE_STATE") { businessId salonId productId quantity state revision }
  }
  query @redact {
    membership(key:{uid:$uid}) @check(expr:"this != null && this.businessId == vars.businessId && this.role == 'HQ'",message:"FORBIDDEN") { businessId role salonAccesses_on_membership { locationId } }
    inventories(where:{location:{businessId:{eq:$businessId},kind:{eq:HQ}},productId:{eq_expr:"response.requestGuard.replenishmentRequest.productId"}},limit:1) @check(expr:"this.size() == 1 && this[0].version == vars.inventoryVersion && this[0].onHand >= response.requestGuard.replenishmentRequest.quantity && this[0].reserved >= response.requestGuard.replenishmentRequest.quantity",message:"STALE_STATE") { locationId productId onHand reserved version }
  }
  changed: replenishmentRequest_updateMany(where:{id:{eq:$requestId},businessId:{eq:$businessId},state:{eq:RESERVED},revision:{eq:$revision}},data:{state:DISPATCHED,revision_update:{inc:1}}) @check(expr:"this == 1",message:"STALE_STATE")
  inventory_updateMany(where:{locationId:{eq_expr:"response.query.inventories[0].locationId"},productId:{eq_expr:"response.requestGuard.replenishmentRequest.productId"},version:{eq:$inventoryVersion}},data:{version_update:{inc:1},reserved_expr:"response.query.inventories[0].reserved - response.requestGuard.replenishmentRequest.quantity",onHand_expr:"response.query.inventories[0].onHand - response.requestGuard.replenishmentRequest.quantity"}) @check(expr:"this == 1",message:"STALE_STATE")
  transfer_updateMany(where:{requestId:{eq:$requestId},businessId:{eq:$businessId},dispatchedQuantity:{eq:0}},data:{dispatchedQuantity_expr:"response.requestGuard.replenishmentRequest.quantity"}) @check(expr:"this == 1",message:"INVALID_TRANSITION")
  stockMovement_insert(data:{transferRequestId:$requestId,businessId:$businessId,type:DISPATCH,quantity_expr:"response.requestGuard.replenishmentRequest.quantity",actorUid:$uid})
  actionReceipt_insert(data:{id:$receiptId,businessId:$businessId,actorUid:$uid,idempotencyKey:$key,requestId:$requestId,action:DISPATCH,payloadHash:$payloadHash,semanticHash:$semanticHash,state:DISPATCHED,revision_expr:"vars.revision + 1"})
  actionKey_insert(data:{businessId:$businessId,actorUid:$uid,idempotencyKey:$key,receiptId:$receiptId,payloadHash:$payloadHash})
}

mutation ReceiveStock($uid:String!, $businessId:String!, $requestId:String!, $revision:Int!, $receiptId:String!, $key:String!, $payloadHash:String!, $semanticHash:String!, $inventoryVersion:Int!, $receivedQuantity:Int!) @auth(level:NO_ACCESS) @transaction {
  requestGuard: query @redact {
    replenishmentRequest(id:$requestId) @check(expr:"this != null && this.businessId == vars.businessId && this.state == 'DISPATCHED' && this.revision == vars.revision",message:"STALE_STATE") { businessId salonId productId quantity state revision }
  }
  query @redact {
    membership(key:{uid:$uid}) @check(expr:"this != null && this.businessId == vars.businessId && this.role == 'SALON' && this.salonAccesses_on_membership.exists(a, a.locationId == response.requestGuard.replenishmentRequest.salonId)",message:"FORBIDDEN") { businessId role salonAccesses_on_membership { locationId } }
    inventories(where:{locationId:{eq_expr:"response.requestGuard.replenishmentRequest.salonId"},productId:{eq_expr:"response.requestGuard.replenishmentRequest.productId"}},limit:1) @check(expr:"this.size() == 1 && this[0].version == vars.inventoryVersion && vars.receivedQuantity == response.requestGuard.replenishmentRequest.quantity",message:"STALE_STATE") { locationId productId onHand reserved version }
  }
  changed: replenishmentRequest_updateMany(where:{id:{eq:$requestId},businessId:{eq:$businessId},state:{eq:DISPATCHED},revision:{eq:$revision}},data:{state:RECEIVED,revision_update:{inc:1}}) @check(expr:"this == 1",message:"STALE_STATE")
  inventory_updateMany(where:{locationId:{eq_expr:"response.query.inventories[0].locationId"},productId:{eq_expr:"response.requestGuard.replenishmentRequest.productId"},version:{eq:$inventoryVersion}},data:{version_update:{inc:1},onHand_expr:"response.query.inventories[0].onHand + vars.receivedQuantity"}) @check(expr:"this == 1",message:"STALE_STATE")
  transfer_updateMany(where:{requestId:{eq:$requestId},businessId:{eq:$businessId},receivedQuantity:{eq:0}},data:{receivedQuantity_expr:"response.requestGuard.replenishmentRequest.quantity"}) @check(expr:"this == 1",message:"INVALID_TRANSITION")
  stockMovement_insert(data:{transferRequestId:$requestId,businessId:$businessId,type:RECEIPT,quantity_expr:"response.requestGuard.replenishmentRequest.quantity",actorUid:$uid})
  activeRequest_deleteMany(where:{requestId:{eq:$requestId},businessId:{eq:$businessId}}) @check(expr:"this == 1",message:"INVALID_TRANSITION")
  actionReceipt_insert(data:{id:$receiptId,businessId:$businessId,actorUid:$uid,idempotencyKey:$key,requestId:$requestId,action:RECEIVE,payloadHash:$payloadHash,semanticHash:$semanticHash,state:RECEIVED,revision_expr:"vars.revision + 1"})
  actionKey_insert(data:{businessId:$businessId,actorUid:$uid,idempotencyKey:$key,receiptId:$receiptId,payloadHash:$payloadHash})
}

mutation BindReplayKey($uid:String!,$businessId:String!,$receiptId:String!,$key:String!,$payloadHash:String!) @auth(level:NO_ACCESS) @transaction {
  original: query @redact {
    actionReceipt(id:$receiptId) @check(expr:"this != null && this.businessId == vars.businessId",message:"FORBIDDEN") { businessId action request { salonId } }
  }
  query @redact {
    membership(key:{uid:$uid}) @check(expr:"this != null && this.businessId == vars.businessId && ((response.original.actionReceipt.action in ['SUBMIT','RECEIVE'] && this.role == 'SALON' && this.salonAccesses_on_membership.exists(a,a.locationId == response.original.actionReceipt.request.salonId)) || (response.original.actionReceipt.action in ['APPROVE','REJECT','DISPATCH'] && this.role == 'HQ'))",message:"FORBIDDEN") { businessId role salonAccesses_on_membership { locationId } }
  }
  actionKey_insert(data:{businessId:$businessId,actorUid:$uid,idempotencyKey:$key,receiptId:$receiptId,payloadHash:$payloadHash})
}
