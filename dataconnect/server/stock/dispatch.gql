  $businessId: String!
  $requestId: String!
  $receiptId: String!
  $key: String!
  $payloadHash: String!
  $semanticHash: String!
  $revision: Int!
  $count: Int!
  $use0: Boolean!
  $use1: Boolean!
  $use2: Boolean!
  $use3: Boolean!
  $use4: Boolean!
  $use5: Boolean!
) @auth(level: NO_ACCESS) @transaction {
  requestGuard: query @redact {
    replenishmentRequest(id: $requestId)
      @check(
        expr: "this != null && this.businessId == vars.businessId && this.state == 'RESERVED' && this.revision == vars.revision && vars.count >= 1 && vars.count <= 6 && this.items.size() == vars.count && vars.use0 == (vars.count > 0) && vars.use1 == (vars.count > 1) && vars.use2 == (vars.count > 2) && vars.use3 == (vars.count > 3) && vars.use4 == (vars.count > 4) && vars.use5 == (vars.count > 5)"
        message: "STALE_STATE"
      ) {
      businessId
      salonId
      state
      revision
      replacementIssueId
      items: requestItems_on_request(orderBy: { productId: ASC }) {
        id
        productId
        quantity
      }
    }
  }
  actor: query @redact {
    membership(key: { uid: $uid })
      @check(
        expr: "this != null && this.businessId == vars.businessId && this.role == 'HQ'"
        message: "FORBIDDEN"
      ) {
      businessId
      role
      salonAccesses_on_membership {
        locationId
      }
    }
  }
  changed: replenishmentRequest_updateMany(
    where: {
      id: { eq: $requestId }
      businessId: { eq: $businessId }
      state: { eq: RESERVED }
      revision: { eq: $revision }
    }
    data: { state: DISPATCHED, revision_update: { inc: 1 } }
  ) @check(expr: "this == 1", message: "STALE_STATE")
  stock0: query @redact @include(if: $use0) {
    inventories(
      where: {
        location: { businessId: { eq: $businessId }, kind: { eq: HQ } }
        productId: {
          eq_expr: "response.requestGuard.replenishmentRequest.items[vars.count > 0 ? 0 : 0].productId"
        }
      }
      limit: 2
    )
      @check(
        expr: "this.size() == 1 && this[0].onHand >= response.requestGuard.replenishmentRequest.items[vars.count > 0 ? 0 : 0].quantity && this[0].reserved >= response.requestGuard.replenishmentRequest.items[vars.count > 0 ? 0 : 0].quantity"
        message: "STALE_STATE"
      ) {
      locationId
      productId
      onHand
      reserved
      version
    }
  }
  update0: inventory_updateMany(
    where: {
      locationId: {
        eq_expr: "(vars.count > 0 ? response.stock0.inventories[0].locationId : response.stock0.inventories[0].locationId)"
      }
      productId: {
        eq_expr: "response.requestGuard.replenishmentRequest.items[vars.count > 0 ? 0 : 0].productId"
      }
      version: {
        eq_expr: "(vars.count > 0 ? response.stock0.inventories[0].version : response.stock0.inventories[0].version)"
      }
    }
    data: {
      version_update: { inc: 1 }
      reserved_expr: "(vars.count > 0 ? response.stock0.inventories[0].reserved : response.stock0.inventories[0].reserved) - response.requestGuard.replenishmentRequest.items[vars.count > 0 ? 0 : 0].quantity"
      onHand_expr: "(vars.count > 0 ? response.stock0.inventories[0].onHand : response.stock0.inventories[0].onHand) - response.requestGuard.replenishmentRequest.items[vars.count > 0 ? 0 : 0].quantity"
    }
  ) @include(if: $use0) @check(expr: "this == 1", message: "STALE_STATE")
  transfer0: transferItem_updateMany(
    where: {
      requestItemId: {
        eq_expr: "response.requestGuard.replenishmentRequest.items[vars.count > 0 ? 0 : 0].id"
      }
      transferRequestId: { eq: $requestId }
      quantity: {
        eq_expr: "response.requestGuard.replenishmentRequest.items[vars.count > 0 ? 0 : 0].quantity"
      }
      dispatchedQuantity: { eq: 0 }
      receivedQuantity: { eq: 0 }
    }
    data: {
      dispatchedQuantity_expr: "response.requestGuard.replenishmentRequest.items[vars.count > 0 ? 0 : 0].quantity"
    }
