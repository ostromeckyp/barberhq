  $versionId: String!
  $documentId: String!
  $operationId: String!
  $key: String!
  $payloadHash: String!
  $pdfSha256: String!
  $retryStage: KnowledgePendingStage!
) @auth(level: NO_ACCESS) @transaction {
  guard: query @redact {
    membership(key: { uid: $uid })
      @check(
        expr: "this != null && this.businessId == vars.businessId && this.role == 'HQ'"
        message: "FORBIDDEN"
      ) {
      businessId
      role
    }
    knowledgeVersion(id: $versionId)
      @check(
        expr: "this != null && this.businessId == vars.businessId && this.documentId == vars.documentId && this.pdfSha256 == vars.pdfSha256 && this.pdfSha256.matches('^[a-f0-9]{64}$') && this.publishedAt == null && this.revokedAt == null && this.bucket != null && this.objectPath != null && this.objectGeneration != null && this.objectGeneration.matches('^[1-9][0-9]*$') && (this.objectGeneration.size() < 16 || (this.objectGeneration.size() == 16 && this.objectGeneration <= '9007199254740991')) && this.contentType == 'application/pdf' && this.byteSize >= 5 && this.byteSize <= 10485760 && this.pageCount >= 1 && this.pageCount <= 30 && this.processingLeaseId == null && this.pendingStage == vars.retryStage && ((this.pendingStage == 'EXTRACT' && (this.status == 'STAGED' || this.status == 'FAILED')) || (this.pendingStage == 'PUBLISH' && this.status == 'READY' && this.reviewedAt != null && this.pendingDocumentRevision != null && this.pendingExtractionHash == this.extractionHash))"
        message: "STALE_STATE"
      ) {
      businessId
      documentId
      pdfSha256
      publishedAt
      revokedAt
      bucket
      objectPath
      objectGeneration
      contentType
      byteSize
      pageCount
      processingLeaseId
      pendingStage
      status
      reviewedAt
      pendingDocumentRevision
      pendingExtractionHash
      extractionHash
