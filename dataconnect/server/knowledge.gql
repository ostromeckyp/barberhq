query KnowledgeCursorDocuments($businessId: String!, $after: String!, $limit: Int!)
@auth(level: NO_ACCESS) {
  knowledgeDocuments(
    where: { businessId: { eq: $businessId }, id: { gt: $after } }
    orderBy: { id: ASC }
    limit: $limit
  ) {
    id
    businessId
    nextVersionNumber
  }
}
query KnowledgeCursorBusiness($businessId: String!) @auth(level: NO_ACCESS) {
  business(id: $businessId) {
    id
  }
}
query KnowledgeCursorLabels($documentId: String!, $after: String!, $limit: Int!)
@auth(level: NO_ACCESS) {
  knowledgeVersions(
    where: { documentId: { eq: $documentId }, versionLabel: { gt: $after } }
    orderBy: { versionLabel: ASC }
    limit: $limit
  ) {
    versionLabel
  }
}
mutation BackfillKnowledgeCursor(
  $businessId: String!
  $documentId: String!
  $expected: Int
  $target: Int!
  $initialize: Boolean!
  $advance: Boolean!
) @auth(level: NO_ACCESS) @transaction {
  guard: query @redact {
    business(id: $businessId)
      @check(
        expr: "this != null && vars.target >= 1 && vars.target <= 2147483647 && vars.initialize != vars.advance"
        message: "VERSION_CONFLICT"
      ) {
      id
    }
    knowledgeDocument(id: $documentId)
      @check(
        expr: "this != null && this.businessId == vars.businessId && ((vars.initialize && this.nextVersionNumber == null && vars.expected == null) || (vars.advance && this.nextVersionNumber == vars.expected && vars.target > vars.expected))"
        message: "STALE_STATE"
      ) {
      businessId
      nextVersionNumber
    }
  }
  initial: knowledgeDocument_updateMany(
    where: {
      id: { eq: $documentId }
      businessId: { eq: $businessId }
      nextVersionNumber: { isNull: true }
    }
    data: { nextVersionNumber: $target }
  ) @include(if: $initialize) @check(expr: "this == 1", message: "STALE_STATE")
  progressed: knowledgeDocument_updateMany(
    where: {
      id: { eq: $documentId }
      businessId: { eq: $businessId }
      nextVersionNumber: { eq: $expected }
    }
    data: { nextVersionNumber: $target }
  ) @include(if: $advance) @check(expr: "this == 1", message: "STALE_STATE")
}
query KnowledgeCommandContext(
  $uid: String!
  $key: String!
  $documentId: String!
  $versionId: String!
) @auth(level: NO_ACCESS) {
  membership(key: { uid: $uid }) {
    businessId
    role
    business {
      operations: knowledgeOperations_on_business(
        where: { actorUid: { eq: $uid }, idempotencyKey: { eq: $key } }
        limit: 1
      ) {
        id
        businessId
        actorUid
        idempotencyKey
        action
        retryStage
        payloadHash
        documentId
        versionId
        completedAt
      }
    }
  }
  knowledgeDocument(id: $documentId) {
    id
    businessId
    documentCode
    activeVersionId
    revision
    nextVersionNumber
  }
  knowledgeVersion(id: $versionId) {
    id
    businessId
    documentId
    versionLabel
    status
    revision
    revokedAt
    publishedAt
    isActive
    pdfSha256
    pendingStage
    processingError
    document {
      activeVersionId
      revision
    }
  }
}
mutation RegisterKnowledgeVersion(
  $uid: String!
  $businessId: String!
  $documentId: String!
  $documentCode: String!
  $versionId: String!
  $versionLabel: String!
  $nextVersionNumber: Int!
  $expectedDocumentRevision: Int!
  $newDocument: Boolean!
  $existingDocument: Boolean!
  $operationId: String!
  $key: String!
  $payloadHash: String!
  $title: String!
  $language: String!
  $sourceType: KnowledgeSourceType
  $kind: KnowledgeDocumentKind!
  $origin: KnowledgeOrigin!
  $synthetic: Boolean!
  $sourceUrls: Any!
  $observedOn: Date
  $pdfSha256: String!
) @auth(level: NO_ACCESS) @transaction {
  guard: query @redact {
    membership(key: { uid: $uid })
      @check(
        expr: "this != null && this.businessId == vars.businessId && this.role == 'HQ'"
        message: "FORBIDDEN"
      ) {
      businessId
      role
    }
    business(id: $businessId)
      @check(
        expr: "this != null && vars.nextVersionNumber > 1 && vars.documentId == vars.businessId + ':' + vars.documentCode && vars.versionId == vars.documentId + ':' + vars.versionLabel && vars.versionLabel == 'v' + string(vars.nextVersionNumber - 1)"
        message: "INVALID_VERSION_IDENTITY"
      ) {
      id
    }
    cursor: knowledgeDocument(id: $documentId)
      @check(expr: "this == null || this.nextVersionNumber != null", message: "VERSION_CONFLICT") {
      nextVersionNumber
    }
    knowledgeDocument(id: $documentId)
      @check(
        expr: "(vars.newDocument && !vars.existingDocument && this == null && vars.expectedDocumentRevision == 0 && vars.nextVersionNumber == 2) || (!vars.newDocument && vars.existingDocument && this != null && this.businessId == vars.businessId && this.documentCode == vars.documentCode && this.revision == vars.expectedDocumentRevision && this.nextVersionNumber + 1 == vars.nextVersionNumber)"
        message: "STALE_STATE"
      ) {
      businessId
      documentCode
      revision
      nextVersionNumber
    }
  }
  knowledgeDocument_insert(
    data: {
      id: $documentId
      businessId: $businessId
      documentCode: $documentCode
      nextVersionNumber: 2
    }
  ) @include(if: $newDocument)
  knowledgeDocument_updateMany(
    where: {
      id: { eq: $documentId }
      businessId: { eq: $businessId }
      revision: { eq: $expectedDocumentRevision }
      nextVersionNumber: { eq_expr: "vars.nextVersionNumber - 1" }
    }
    data: { nextVersionNumber: $nextVersionNumber }
  ) @include(if: $existingDocument) @check(expr: "this == 1", message: "STALE_STATE")
  knowledgeVersion_insert(
    data: {
      id: $versionId
      documentId: $documentId
      businessId: $businessId
      versionLabel: $versionLabel
      title: $title
      language: $language
      sourceType: $sourceType
      kind: $kind
      origin: $origin
      publicationStatus: DEMO_CURRENT
      synthetic: $synthetic
      sourceUrls: $sourceUrls
      observedOn: $observedOn
      status: STAGED
      revision: 1
      pdfSha256: $pdfSha256
    }
  )
  knowledgeOperation_insert(
    data: {
      id: $operationId
      businessId: $businessId
      actorUid: $uid
      idempotencyKey: $key
      action: CREATE
      payloadHash: $payloadHash
      documentId: $documentId
      versionId: $versionId
      completedAt_expr: "request.time"
    }
  )
}
mutation BindKnowledgeOriginal(
  $uid: String!
  $businessId: String!
  $versionId: String!
  $pdfSha256: String!
  $bucket: String!
  $objectPath: String!
  $objectGeneration: String!
  $byteSize: Int!
  $pageCount: Int!
) @auth(level: NO_ACCESS) @transaction {
  guard: query @redact {
    membership(key: { uid: $uid })
      @check(
        expr: "this != null && this.businessId == vars.businessId && this.role == 'HQ'"
        message: "FORBIDDEN"
      ) {
      businessId
      role
    }
    knowledgeVersion(id: $versionId)
      @check(
        expr: "this != null && this.businessId == vars.businessId && this.pdfSha256 == vars.pdfSha256 && vars.pdfSha256.matches('^[a-f0-9]{64}$') && vars.bucket.matches('^[A-Za-z0-9][A-Za-z0-9._-]*$') && vars.objectGeneration.matches('^[1-9][0-9]*$') && (vars.objectGeneration.size() < 16 || (vars.objectGeneration.size() == 16 && vars.objectGeneration <= '9007199254740991')) && vars.byteSize >= 5 && vars.byteSize <= 10485760 && vars.pageCount >= 1 && vars.pageCount <= 30 && vars.objectPath == 'knowledge/' + vars.businessId + '/' + this.document.documentCode + '/' + this.versionLabel + '/' + vars.pdfSha256 + '.pdf'"
        message: "VERSION_CONFLICT"
      ) {
      businessId
      pdfSha256
      versionLabel
      document {
        documentCode
      }
    }
  }
  knowledgeVersion_updateMany(
    where: {
      id: { eq: $versionId }
      businessId: { eq: $businessId }
      pdfSha256: { eq: $pdfSha256 }
      status: { eq: STAGED }
      revokedAt: { isNull: true }
      publishedAt: { isNull: true }
      bucket: { isNull: true }
      objectPath: { isNull: true }
      objectGeneration: { isNull: true }
      contentType: { isNull: true }
      byteSize: { isNull: true }
      pageCount: { isNull: true }
      uploadedAt: { isNull: true }
    }
    data: {
      bucket: $bucket
      objectPath: $objectPath
      objectGeneration: $objectGeneration
      contentType: "application/pdf"
      byteSize: $byteSize
      pageCount: $pageCount
      uploadedAt_expr: "request.time"
      pendingStage: EXTRACT
    }
  ) @check(expr: "this == 1", message: "VERSION_CONFLICT")
}
mutation SetKnowledgeDispatchFailure(
  $versionId: String!
  $revision: Int!
  $stage: KnowledgePendingStage!
  $status: KnowledgeProcessingStatus!
  $errorCode: String!
  $expectedDocumentRevision: Int
  $extractionHash: String
) @auth(level: NO_ACCESS) @transaction {
  guard: query @redact {
    knowledgeVersion(id: $versionId)
      @check(
        expr: "this != null && this.revision == vars.revision && this.pendingStage == vars.stage && this.pendingDocumentRevision == vars.expectedDocumentRevision && this.pendingExtractionHash == vars.extractionHash && this.publishedAt == null && this.revokedAt == null && ((vars.stage == 'EXTRACT' && vars.status == 'FAILED' && (this.status == 'STAGED' || this.status == 'FAILED')) || (vars.stage == 'PUBLISH' && vars.status == 'READY' && this.status == 'READY'))"
        message: "STALE_STATE"
      ) {
      revision
      pendingStage
      pendingDocumentRevision
      pendingExtractionHash
      publishedAt
      revokedAt
      status
    }
  }
  knowledgeVersion_updateMany(
    where: {
      id: { eq: $versionId }
      revision: { eq: $revision }
      pendingStage: { eq: $stage }
      revokedAt: { isNull: true }
      publishedAt: { isNull: true }
    }
    data: { status: $status, processingError: $errorCode, revision_update: { inc: 1 } }
  ) @check(expr: "this == 1", message: "STALE_STATE")
}
mutation SetKnowledgeDispatchPending(
  $uid: String!
  $businessId: String!
  $versionId: String!
  $revision: Int!
  $stage: KnowledgePendingStage!
  $expectedDocumentRevision: Int
  $extractionHash: String
) @auth(level: NO_ACCESS) @transaction {
  guard: query @redact {
    membership(key: { uid: $uid })
      @check(
        expr: "this != null && this.businessId == vars.businessId && this.role == 'HQ'"
        message: "FORBIDDEN"
      ) {
      businessId
      role
    }
    knowledgeVersion(id: $versionId)
      @check(
        expr: "this != null && this.businessId == vars.businessId && this.revision == vars.revision && this.publishedAt == null && this.revokedAt == null && this.bucket != null && this.objectPath != null && this.objectGeneration != null && this.objectGeneration.matches('^[1-9][0-9]*$') && (this.objectGeneration.size() < 16 || (this.objectGeneration.size() == 16 && this.objectGeneration <= '9007199254740991')) && this.pdfSha256.matches('^[a-f0-9]{64}$') && this.contentType == 'application/pdf' && this.byteSize >= 5 && this.byteSize <= 10485760 && this.pageCount >= 1 && this.pageCount <= 30 && this.processingLeaseId == null && ((vars.stage == 'EXTRACT' && (this.status == 'STAGED' || this.status == 'FAILED') && this.pendingStage == 'EXTRACT' && this.uploadedAt != null && vars.expectedDocumentRevision == this.document.revision && vars.extractionHash == null) || (vars.stage == 'PUBLISH' && this.status == 'READY' && this.reviewedAt != null && this.extractionHash == vars.extractionHash && ((this.pendingStage == null && this.pendingDocumentRevision == null && this.pendingExtractionHash == null) || (this.pendingStage == 'PUBLISH' && this.pendingDocumentRevision == vars.expectedDocumentRevision && this.pendingExtractionHash == vars.extractionHash))))"
        message: "STALE_STATE"
      ) {
      businessId
      revision
      publishedAt
      revokedAt
      bucket
      objectPath
      objectGeneration
      pdfSha256
      contentType
      byteSize
      pageCount
      uploadedAt
      processingLeaseId
      status
      pendingStage
      reviewedAt
      extractionHash
      pendingDocumentRevision
      pendingExtractionHash
      document {
        revision
      }
    }
  }
  knowledgeVersion_updateMany(
    where: {
      id: { eq: $versionId }
      businessId: { eq: $businessId }
      revision: { eq: $revision }
      revokedAt: { isNull: true }
      publishedAt: { isNull: true }
    }
    data: {
      pendingStage: $stage
      pendingDocumentRevision: $expectedDocumentRevision
      pendingExtractionHash: $extractionHash
      processingError: null
      revision_update: { inc: 1 }
    }
  ) @check(expr: "this == 1", message: "STALE_STATE")
}
mutation StartKnowledgeRetry(
