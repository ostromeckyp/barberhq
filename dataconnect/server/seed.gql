# Operator only. Caller validates an explicit demo target and quiescent confirmation.
mutation ResetDemoStock($businessId: String!, $productIds: [String!]!)
@auth(level: NO_ACCESS)
@transaction {
  deliveryKeys: deliveryActionKey_deleteMany(where: { businessId: { eq: $businessId } })
  deliveryCommands: deliveryCommandReceipt_deleteMany(where: { businessId: { eq: $businessId } })

  deliveryEvents: deliveryIssueEvent_deleteMany(
    where: { issue: { businessId: { eq: $businessId } } }
  )
  deliveryIssueItems: deliveryIssueItem_deleteMany(
    where: { issue: { businessId: { eq: $businessId } } }
  )
  deliveryIssues: deliveryIssue_deleteMany(where: { businessId: { eq: $businessId } })
  deliveryReferences: deliveryReceiptProcedure_deleteMany(
    where: { receipt: { businessId: { eq: $businessId } } }
  )
  deliveryItems: deliveryReceiptItem_deleteMany(
    where: { receipt: { businessId: { eq: $businessId } } }
  )
  deliveryReceipts: deliveryReceipt_deleteMany(where: { businessId: { eq: $businessId } })
  keys: actionKey_deleteMany(where: { businessId: { eq: $businessId } })
  receipts: actionReceipt_deleteMany(where: { businessId: { eq: $businessId } })
  movements: stockMovement_deleteMany(where: { businessId: { eq: $businessId } })
  transferItems: transferItem_deleteMany(where: { transfer: { businessId: { eq: $businessId } } })
  transfers: transfer_deleteMany(where: { businessId: { eq: $businessId } })
  active: activeRequest_deleteMany(where: { businessId: { eq: $businessId } })
  items: requestItem_deleteMany(where: { request: { businessId: { eq: $businessId } } })
  requests: replenishmentRequest_deleteMany(where: { businessId: { eq: $businessId } })
  hq: inventory_updateMany(
    where: {
      location: { businessId: { eq: $businessId }, key: { eq: "hq" } }
      productId: { in: $productIds }
    }
    data: { onHand: 18, reserved: 0, version_update: { inc: 1 } }
  ) @check(expr: "this == 6", message: "Unexpected demo inventory; reset rolled back")
  salons: inventory_updateMany(
    where: {
      location: {
        businessId: { eq: $businessId }
        key: { in: ["legnicka", "lodzka", "zakladowa"] }
      }
      productId: { in: $productIds }
    }
    data: { onHand: 2, reserved: 0, version_update: { inc: 1 } }
  ) @check(expr: "this == 18", message: "Unexpected demo inventory; reset rolled back")
}

mutation InsertSalonSettings($salonId: String!) @auth(level: NO_ACCESS) {
  salonSettings_insert(data: { salonId: $salonId, lowStockThreshold: 2, version: 1 })
}
# Explicit reviewed alias seed (scripts/seed/product-aliases.ts). Never run at application startup.
query ReadProductAliasSeedState($businessId: String!) @auth(level: NO_ACCESS) {
  business(id: $businessId) {
    productKnowledgeRevision
  }
  products(where: { businessId: { eq: $businessId } }, orderBy: { id: ASC }, limit: 201) {
    id
    demoId
    seedType
    keywords
    typeSourceVersionId
  }
  productAliases(
    where: { businessId: { eq: $businessId }, source: { eq: SEED } }
    orderBy: { id: ASC }
    limit: 5001
  ) {
    id
    productId
    phrase
    normalized
    kind
    lang
    source
    status
    overriddenByHq
  }
}
# One fenced transaction: only SEED rows change; a current document type is never overwritten.
mutation ApplyProductAliasSeed(
  $businessId: String!
  $expectedRevision: Int!
  $aliasesJson: String!
  $retireJson: String!
  $productsJson: String!
) @auth(level: NO_ACCESS) @transaction {
  result: _execute(
    sql: """
    WITH guard AS MATERIALIZED (
    SELECT id FROM business WHERE id=$1 AND product_knowledge_revision=$2 AND product_knowledge_revision<2147483647 FOR UPDATE
    ), upserted AS (
    INSERT INTO product_alias SELECT x.* FROM jsonb_populate_recordset(NULL::product_alias,$3::jsonb) x
    JOIN product p ON p.id=x.product_id AND p.business_id=$1
    WHERE x.business_id=$1 AND x.source::text='SEED' AND x.status::text='ACTIVE' AND x.salon_id IS NULL
    AND x.source_document_version_id IS NULL AND x.id LIKE 'seed:%' AND EXISTS(SELECT 1 FROM guard)
    ON CONFLICT (id) DO UPDATE SET phrase=EXCLUDED.phrase,status='ACTIVE',ambiguous=false,revision=product_alias.revision+1
    WHERE product_alias.business_id=$1 AND product_alias.source::text='SEED' AND NOT product_alias.overridden_by_hq
    AND product_alias.salon_id IS NULL
    AND product_alias.source_document_version_id IS NULL RETURNING id
    ), retired AS (
    UPDATE product_alias a SET status='RETIRED',ambiguous=false,revision=a.revision+1
    WHERE a.business_id=$1 AND a.source::text='SEED' AND a.status::text<>'RETIRED' AND NOT a.overridden_by_hq
    AND a.id IN (SELECT jsonb_array_elements_text($4::jsonb)) AND EXISTS(SELECT 1 FROM guard) RETURNING a.id
    ), seeded AS (
    UPDATE product p SET seed_type=x->>'seedType',keywords=ARRAY(SELECT jsonb_array_elements_text(x->'keywords')),
    type=CASE WHEN p.type_source_version_id IS NULL THEN x->>'seedType' ELSE p.type END
    FROM jsonb_array_elements($5::jsonb) x WHERE p.id=x->>'id' AND p.business_id=$1 AND EXISTS(SELECT 1 FROM guard) RETURNING p.id
    )
    UPDATE business SET product_knowledge_revision=product_knowledge_revision+1
    WHERE id IN (SELECT id FROM guard)
    AND (SELECT count(*) FROM upserted)=jsonb_array_length($3::jsonb)
    AND (SELECT count(*) FROM retired)=jsonb_array_length($4::jsonb)
    AND (SELECT count(*) FROM seeded)=jsonb_array_length($5::jsonb)
    """
    params: [$businessId, $expectedRevision, $aliasesJson, $retireJson, $productsJson]
  ) @check(expr: "this == 1", message: "STALE_STATE")
}

# Demo reset of HQ product administration: back to the seeded baseline (alias seed re-applies after).
mutation ResetProductAdmin($businessId: String!, $seedProductIdsJson: String!)
@auth(level: NO_ACCESS)
@transaction {
  result: _execute(
    sql: """
    WITH extra AS MATERIALIZED (
    SELECT id FROM product WHERE business_id=$1 AND id NOT IN (SELECT jsonb_array_elements_text($2::jsonb))
    ), att AS (DELETE FROM product_card_attachment WHERE business_id=$1 RETURNING product_id),
    adj AS (DELETE FROM hq_stock_adjustment WHERE business_id=$1 RETURNING id),
    ops AS (DELETE FROM product_admin_operation WHERE business_id=$1 RETURNING id),
    hq_aliases AS (
    DELETE FROM product_alias WHERE business_id=$1 AND source::text='HQ' AND source_document_version_id IS NULL RETURNING id
    ), overrides AS (UPDATE product_alias SET overridden_by_hq=false WHERE business_id=$1 AND overridden_by_hq RETURNING id),
    inv AS (DELETE FROM inventory WHERE product_id IN (SELECT id FROM extra) RETURNING product_id),
    removed AS (
    DELETE FROM product WHERE id IN (SELECT id FROM extra) AND (SELECT count(*) FROM inv)>=0
    AND (SELECT count(*) FROM att)>=0 AND (SELECT count(*) FROM hq_aliases)>=0 RETURNING id
    )
    UPDATE product SET hq_updated_at=NULL,hq_updated_by=NULL
    WHERE business_id=$1 AND id NOT IN (SELECT id FROM extra)
    AND (SELECT count(*) FROM removed)>=0 AND (SELECT count(*) FROM adj)>=0 AND (SELECT count(*) FROM ops)>=0
    AND (SELECT count(*) FROM overrides)>=0
    """
    params: [$businessId, $seedProductIdsJson]
  )
}

# Full demo reset: what the knowledge wipe would remove.
query ReadKnowledgeWipeCounts($businessId: String!) @auth(level: NO_ACCESS) {
  documents: knowledgeDocuments(where: { businessId: { eq: $businessId } }) {
    _count
  }
  versions: knowledgeVersions(where: { businessId: { eq: $businessId } }) {
    _count
  }
  chunks: knowledgeChunks(where: { version: { businessId: { eq: $businessId } } }) {
    _count
  }
  cardAttachments: productCardAttachments(where: { businessId: { eq: $businessId } }) {
    _count
  }
  documentAliases: productAliases(
    where: { businessId: { eq: $businessId }, sourceDocumentVersionId: { isNull: false } }
  ) {
    _count
  }
}

# Full demo reset: every knowledge row of the business. Deleting documents cascades to versions,
# pages, chunks, product links/profiles/operations and receipt procedure references; procedure
# bindings fall back to null (the rebuild binds the seeded procedures). Seed and HQ aliases stay.
mutation WipeDemoKnowledge($businessId: String!) @auth(level: NO_ACCESS) @transaction {
  result: _execute(
    sql: """
    WITH doc_aliases AS (
    DELETE FROM product_alias WHERE business_id=$1 AND source_document_version_id IS NOT NULL RETURNING id
    ), att AS (DELETE FROM product_card_attachment WHERE business_id=$1 RETURNING product_id),
    kops AS (DELETE FROM knowledge_operation WHERE business_id=$1 RETURNING id),
    pops AS (DELETE FROM product_knowledge_operation WHERE business_id=$1 RETURNING id),
    types AS (
    UPDATE product SET type=seed_type,type_source_version_id=NULL
    WHERE business_id=$1 AND type_source_version_id IS NOT NULL RETURNING id
    ), docs AS (
    DELETE FROM knowledge_document WHERE business_id=$1
    AND (SELECT count(*) FROM doc_aliases)>=0 AND (SELECT count(*) FROM pops)>=0 RETURNING id
    )
    UPDATE business SET product_knowledge_revision=product_knowledge_revision+1
    WHERE id=$1 AND product_knowledge_revision<2147483647
    AND (SELECT count(*) FROM docs)>=0 AND (SELECT count(*) FROM att)>=0
    AND (SELECT count(*) FROM kops)>=0 AND (SELECT count(*) FROM types)>=0
    """
    params: [$businessId]
  ) @check(expr: "this == 1", message: "STALE_STATE")
}

# Full demo reset: each seeded product card is attached to its product as published.
mutation SeedProductCardAttachment(
  $businessId: String!
  $productId: String!
  $documentId: String!
  $versionId: String!
) @auth(level: NO_ACCESS) @transaction {
  result: _execute(
    sql: """
    INSERT INTO product_card_attachment (product_id,business_id,document_id,version_id,status,suggestions,actor_uid,revision,updated_at)
    SELECT p.id,$1,$3,$4,'PUBLISHED','[]'::jsonb,'seed',1,clock_timestamp() FROM product p
    WHERE p.id=$2 AND p.business_id=$1
    AND EXISTS(SELECT 1 FROM knowledge_version v WHERE v.id=$4 AND v.document_id=$3 AND v.business_id=$1)
    ON CONFLICT (product_id) DO UPDATE SET document_id=EXCLUDED.document_id,version_id=EXCLUDED.version_id,
    status=EXCLUDED.status,suggestions=EXCLUDED.suggestions,actor_uid=EXCLUDED.actor_uid,
    revision=product_card_attachment.revision+1,updated_at=EXCLUDED.updated_at
    """
    params: [$businessId, $productId, $documentId, $versionId]
  ) @check(expr: "this == 1", message: "STALE_STATE")
}

# Full demo reset: each delivery problem kind is bound to its seeded procedure.
mutation SeedDeliveryProcedureBindings(
  $businessId: String!
  $bindingsJson: String!
  $expectedCount: Int!
) @auth(level: NO_ACCESS) @transaction {
  result: _execute(
    sql: """
    INSERT INTO delivery_procedure_binding (business_id,kind,document_id,revision,updated_at)
    SELECT $1,x.kind::delivery_problem_kind,x.document_id,1,clock_timestamp()
    FROM jsonb_to_recordset($2::jsonb) AS x(kind text, document_id text)
    WHERE EXISTS(SELECT 1 FROM knowledge_document d WHERE d.id=x.document_id AND d.business_id=$1)
    ON CONFLICT (business_id,kind) DO UPDATE SET document_id=EXCLUDED.document_id,
    revision=delivery_procedure_binding.revision+1,updated_at=EXCLUDED.updated_at
    """
    params: [$businessId, $bindingsJson]
  ) @check(expr: "this == vars.expectedCount", message: "STALE_STATE")
}
