query ReadSeedState($businessId: String!) @auth(level: NO_ACCESS) {
  business(id: $businessId) { id name }
  locations(where: {businessId: {eq: $businessId}}, limit: 100) { id key }
  products(where: {businessId: {eq: $businessId}}, limit: 100) { id demoId }
  inventories(where: {location: {businessId: {eq: $businessId}}}, limit: 1000) { locationId productId onHand reserved version }
}
query ReadMembership($uid: String!) @auth(level: NO_ACCESS) {
  membership(key: {uid: $uid}) { uid businessId role }
}
mutation UpsertBusiness($id: String!, $name: String!) @auth(level: NO_ACCESS) {
  business_upsert(data: {id: $id, name: $name})
}
mutation UpsertLocation($id: String!, $businessId: String!, $key: String!, $name: String!, $kind: LocationKind!) @auth(level: NO_ACCESS) {
  location_upsert(data: {id: $id, businessId: $businessId, key: $key, name: $name, kind: $kind})
}
mutation UpsertProduct($id: String!, $businessId: String!, $demoId: String!, $name: String!, $brand: String!, $category: String!, $summaryEn: String!, $scentPl: String, $sourceCode: String!, $netContentMl: Int!, $retailPriceGrosz: Int!, $sourceUrl: String!, $observedOn: Date!) @auth(level: NO_ACCESS) {
  product_upsert(data: {id:$id, businessId:$businessId, demoId:$demoId, name:$name, brand:$brand, category:$category, summaryEn:$summaryEn, scentPl:$scentPl, sourceCode:$sourceCode, netContentMl:$netContentMl, retailPriceGrosz:$retailPriceGrosz, sourceUrl:$sourceUrl, observedOn:$observedOn})
}
mutation InsertInventory($locationId: String!, $productId: String!, $onHand: Int!) @auth(level: NO_ACCESS) {
  inventory_insert(data: {locationId:$locationId, productId:$productId, onHand:$onHand, reserved:0, version:1})
}
mutation UpsertMembership($uid: String!, $businessId: String!, $role: MemberRole!) @auth(level: NO_ACCESS) @transaction {
  membership_upsert(data: {uid:$uid, businessId:$businessId, role:$role})
  salonAccess_deleteMany(where: {membershipUid:{eq:$uid}})
}
mutation UpsertSalonAccess($uid: String!, $locationId: String!) @auth(level: NO_ACCESS) {
  salonAccess_upsert(data: {membershipUid:$uid, locationId:$locationId})
}

query ReadResetCounts($businessId:String!) @auth(level:NO_ACCESS) {
  requests: replenishmentRequests(where:{businessId:{eq:$businessId}}){_count}
  active: activeRequests(where:{businessId:{eq:$businessId}}){_count}
  transfers(where:{businessId:{eq:$businessId}}){_count}
  movements: stockMovements(where:{businessId:{eq:$businessId}}){_count}
  receipts: actionReceipts(where:{businessId:{eq:$businessId}}){_count}
  keys: actionKeys(where:{businessId:{eq:$businessId}}){_count}
  inventories(where:{location:{businessId:{eq:$businessId}}}){_count}
}
# Operator only. Caller validates an explicit demo target and quiescent confirmation.
mutation ResetDemoStock($businessId:String!, $productIds:[String!]!) @auth(level:NO_ACCESS) @transaction {
  keys: actionKey_deleteMany(where:{businessId:{eq:$businessId}})
  receipts: actionReceipt_deleteMany(where:{businessId:{eq:$businessId}})
  movements: stockMovement_deleteMany(where:{businessId:{eq:$businessId}})
  transfers: transfer_deleteMany(where:{businessId:{eq:$businessId}})
  active: activeRequest_deleteMany(where:{businessId:{eq:$businessId}})
  requests: replenishmentRequest_deleteMany(where:{businessId:{eq:$businessId}})
  hq: inventory_updateMany(where:{location:{businessId:{eq:$businessId},key:{eq:"hq"}},productId:{in:$productIds}},data:{onHand:18,reserved:0,version_update:{inc:1}}) @check(expr:"this == 6",message:"Unexpected demo inventory; reset rolled back")
  salons: inventory_updateMany(where:{location:{businessId:{eq:$businessId},key:{in:["legnicka","lodzka","zakladowa"]}},productId:{in:$productIds}},data:{onHand:2,reserved:0,version_update:{inc:1}}) @check(expr:"this == 18",message:"Unexpected demo inventory; reset rolled back")
}
