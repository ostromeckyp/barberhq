mutation SetKnowledgePublishIntent(
  $uid: String!
  $businessId: String!
  $versionId: String!
  $revision: Int!
  $expectedDocumentRevision: Int!
  $extractionHash: String!
  $productKnowledgeReviewedHash: String = null
  $productKnowledgeRevision: Int = null
  $productKnowledgeCatalogRevision: Int = null
  $configHash: String!
) @auth(level: NO_ACCESS) @transaction {
  guard: query @redact {
    membership(key: { uid: $uid })
      @check(
        expr: "this != null && this.businessId == vars.businessId && this.role == 'HQ'"
        message: "FORBIDDEN"
      ) {
      businessId
      role
    }
    knowledgeVersion(id: $versionId)
      @check(
        expr: "this != null && (!(this.kind in ['PRODUCT_CARD','PRODUCT_CATALOG']) || (vars.productKnowledgeReviewedHash != null && this.productKnowledgeReviewedHash == vars.productKnowledgeReviewedHash && this.productKnowledgeRevision == vars.productKnowledgeRevision && this.productKnowledgeCatalogRevision == vars.productKnowledgeCatalogRevision && this.business.productKnowledgeRevision == vars.productKnowledgeCatalogRevision)) && this.businessId == vars.businessId && this.revision == vars.revision && this.status == 'READY' && this.reviewedBy == 'hq:' + vars.uid && this.reviewedAt != null && this.reviewedPageCount == this.pageCount && this.extractionHash == vars.extractionHash && this.embeddingConfigHash == vars.configHash && this.document.revision == vars.expectedDocumentRevision && this.pendingStage == null && this.publishedAt == null && this.revokedAt == null && this.pages.size() == this.pageCount && this.pages.all(p,p.reviewed == true && p.quality == 'COMPLETE') && this.chunks.size() == this.expectedChunkCount && this.chunks.all(c,c.embeddingConfigHash == vars.configHash && c.embeddingDimension == 768)"
        message: "STALE_STATE"
      ) {
      kind
      productKnowledgeReviewedHash
      productKnowledgeRevision
      productKnowledgeCatalogRevision
      business {
        productKnowledgeRevision
      }
      businessId
      revision
      status
      reviewedBy
      reviewedAt
      reviewedPageCount
      pageCount
      extractionHash
      pendingStage
      publishedAt
      revokedAt
      embeddingConfigHash
      expectedChunkCount
      document {
        revision
      }
      pages: knowledgePages_on_version {
        reviewed
        quality
      }
      chunks: knowledgeChunks_on_version {
        embeddingConfigHash
        embeddingDimension
      }
    }
  }
  knowledgeVersion_updateMany(
    where: {
      id: { eq: $versionId }
      businessId: { eq: $businessId }
      revision: { eq: $revision }
      status: { eq: READY }
      revokedAt: { isNull: true }
      publishedAt: { isNull: true }
      pendingStage: { isNull: true }
    }
    data: {
      pendingProductKnowledgeReviewedHash: $productKnowledgeReviewedHash
      pendingProductKnowledgeRevision: $productKnowledgeRevision
      pendingProductKnowledgeCatalogRevision: $productKnowledgeCatalogRevision
      pendingStage: PUBLISH
      pendingDocumentRevision: $expectedDocumentRevision
      pendingExtractionHash: $extractionHash
      processingError: null
      revision_update: { inc: 1 }
    }
  ) @check(expr: "this == 1", message: "STALE_STATE")
}

mutation SetOperatorKnowledgePublishIntent(
  $businessId: String!
  $versionId: String!
  $revision: Int!
  $expectedDocumentRevision: Int!
  $extractionHash: String!
  $configHash: String!
  $productKnowledgeReviewedHash: String = null
  $productKnowledgeRevision: Int = null
  $productKnowledgeCatalogRevision: Int = null
) @auth(level: NO_ACCESS) @transaction {
  guard: query @redact {
    knowledgeVersion(id: $versionId)
      @check(
        expr: "this != null && (!(this.kind in ['PRODUCT_CARD','PRODUCT_CATALOG']) || (this.productKnowledgeReviewedHash != null && this.productKnowledgeReviewedHash == vars.productKnowledgeReviewedHash && this.productKnowledgeRevision == vars.productKnowledgeRevision && this.productKnowledgeCatalogRevision == vars.productKnowledgeCatalogRevision && this.business.productKnowledgeRevision == vars.productKnowledgeCatalogRevision)) && this.businessId == vars.businessId && this.revision == vars.revision && this.status == 'READY' && this.reviewedBy.matches('^operator:.+') && this.reviewedAt != null && this.reviewedPageCount == this.pageCount && this.extractionHash == vars.extractionHash && this.embeddingConfigHash == vars.configHash && this.document.revision == vars.expectedDocumentRevision && this.pendingStage == null && this.publishedAt == null && this.revokedAt == null && this.pages.size() == this.pageCount && this.pages.all(p,p.reviewed == true && p.quality == 'COMPLETE') && this.chunks.size() == this.expectedChunkCount && this.chunks.all(c,c.embeddingConfigHash == vars.configHash && c.embeddingDimension == 768)"
        message: "NOT_READY"
      ) {
      kind
      businessId
      productKnowledgeReviewedHash
      productKnowledgeRevision
      productKnowledgeCatalogRevision
      business {
        productKnowledgeRevision
      }
      revision
      status
      reviewedBy
      reviewedAt
      reviewedPageCount
      pageCount
      extractionHash
      pendingStage
      publishedAt
      revokedAt
      embeddingConfigHash
      expectedChunkCount
      document {
        revision
      }
      pages: knowledgePages_on_version {
        reviewed
        quality
      }
      chunks: knowledgeChunks_on_version {
        embeddingConfigHash
        embeddingDimension
      }
    }
  }
  knowledgeVersion_updateMany(
    where: {
      id: { eq: $versionId }
      businessId: { eq: $businessId }
      revision: { eq: $revision }
      status: { eq: READY }
      revokedAt: { isNull: true }
      publishedAt: { isNull: true }
      pendingStage: { isNull: true }
    }
    data: {
      pendingStage: PUBLISH
      pendingDocumentRevision: $expectedDocumentRevision
      pendingExtractionHash: $extractionHash
      pendingProductKnowledgeReviewedHash: $productKnowledgeReviewedHash
      pendingProductKnowledgeRevision: $productKnowledgeRevision
      pendingProductKnowledgeCatalogRevision: $productKnowledgeCatalogRevision
      revision_update: { inc: 1 }
    }
  ) @check(expr: "this == 1", message: "STALE_STATE")
}

mutation MarkKnowledgePublishStale(
  $versionId: String!
  $revision: Int!
  $expectedDocumentRevision: Int!
  $extractionHash: String!
) @auth(level: NO_ACCESS) @transaction {
  result: _execute(
    sql: """
    UPDATE knowledge_version v SET pending_stage=NULL,pending_document_revision=NULL,pending_extraction_hash=NULL,
    pending_product_knowledge_reviewed_hash=NULL,pending_product_knowledge_revision=NULL,pending_product_knowledge_catalog_revision=NULL,
    processing_error='STALE_STATE',revision=revision+1
    WHERE v.id=$1 AND v.revision=$2 AND v.status::text='READY' AND v.pending_stage::text='PUBLISH'
    AND v.pending_document_revision=$3 AND v.pending_extraction_hash=$4 AND v.extraction_hash=$4
    AND v.published_at IS NULL AND v.revoked_at IS NULL AND (
    EXISTS(SELECT 1 FROM knowledge_document d WHERE d.id=v.document_id AND d.revision<>$3)
    OR (v.pending_product_knowledge_catalog_revision IS NOT NULL AND EXISTS(SELECT 1 FROM business b WHERE b.id=v.business_id AND b.product_knowledge_revision<>v.pending_product_knowledge_catalog_revision))
    OR (v.pending_product_knowledge_reviewed_hash IS NOT NULL AND v.reviewed_by NOT LIKE 'operator:%' AND NOT EXISTS(SELECT 1 FROM membership m WHERE m.business_id=v.business_id AND m.role::text='HQ' AND v.reviewed_by='hq:'||m.uid))
    )
    """
    params: [$versionId, $revision, $expectedDocumentRevision, $extractionHash]
  ) @check(expr: "this == 1", message: "STALE_STATE")
}

mutation PublishKnowledgeVersion(
  $versionId: String!
  $documentId: String!
  $businessId: String!
  $expectedDocumentRevision: Int!
  $versionRevision: Int!
  $extractionHash: String!
  $configHash: String!
) @auth(level: NO_ACCESS) @transaction {
  result: _execute(
    sql: """
    WITH actor AS MATERIALIZED (SELECT m.uid FROM membership m JOIN knowledge_version v ON v.id=$2 AND v.business_id=m.business_id
    WHERE m.business_id=$1 AND m.role::text='HQ' AND v.reviewed_by='hq:'||m.uid FOR SHARE OF m),
    business_snapshot AS MATERIALIZED (SELECT product_knowledge_revision FROM business WHERE id=$1),
    business_lock AS (
    UPDATE business b SET product_knowledge_revision=product_knowledge_revision+CASE WHEN EXISTS(SELECT 1 FROM knowledge_version v WHERE v.id=$2 AND v.kind::text IN ('PRODUCT_CARD','PRODUCT_CATALOG')) OR EXISTS(SELECT 1 FROM knowledge_product_profile kp JOIN knowledge_version v ON v.id=kp.version_id WHERE v.document_id=$3) THEN 1 ELSE 0 END
    WHERE b.id=$1 AND b.product_knowledge_revision=(SELECT product_knowledge_revision FROM business_snapshot) AND b.product_knowledge_revision<2147483647 AND EXISTS(SELECT 1 FROM knowledge_version v WHERE v.id=$2 AND v.business_id=$1 AND (
    v.kind IS NULL OR v.kind::text NOT IN ('PRODUCT_CARD','PRODUCT_CATALOG') OR
    (v.pending_product_knowledge_reviewed_hash IS NOT NULL AND v.product_knowledge_reviewed_hash=v.pending_product_knowledge_reviewed_hash AND v.product_knowledge_revision=v.pending_product_knowledge_revision AND v.product_knowledge_catalog_revision=v.pending_product_knowledge_catalog_revision AND b.product_knowledge_revision=v.pending_product_knowledge_catalog_revision AND (EXISTS(SELECT 1 FROM actor) OR v.reviewed_by LIKE 'operator:%')) OR
    (v.pending_product_knowledge_reviewed_hash IS NULL AND v.product_knowledge_revision=0 AND NOT EXISTS(SELECT 1 FROM knowledge_product_link l WHERE l.version_id=v.id) AND NOT EXISTS(SELECT 1 FROM knowledge_product_profile kp WHERE kp.version_id=v.id) AND NOT EXISTS(SELECT 1 FROM product_alias a WHERE a.source_document_version_id=v.id)))) RETURNING b.id
    ), guard AS MATERIALIZED (
    SELECT v.id FROM knowledge_version v WHERE v.id=$2 AND v.business_id=$1 AND v.document_id=$3
    AND v.publication_status::text='DEMO_CURRENT' AND v.status::text='READY' AND v.revision=$5
    AND v.pending_stage::text='PUBLISH' AND v.pending_document_revision=$4 AND v.pending_extraction_hash=$6
    AND v.extraction_hash=$6 AND v.revoked_at IS NULL AND v.published_at IS NULL AND v.embedding_config_hash=$7
    AND v.reviewed_page_count=v.page_count
    AND (SELECT count(*) FROM knowledge_page p WHERE p.version_id=v.id)=v.page_count
    AND NOT EXISTS(SELECT 1 FROM knowledge_page p WHERE p.version_id=v.id AND (NOT p.reviewed OR p.quality::text<>'COMPLETE'))
    AND (SELECT count(*) FROM knowledge_chunk c WHERE c.version_id=v.id)=v.expected_chunk_count
    AND NOT EXISTS(SELECT 1 FROM knowledge_chunk c WHERE c.version_id=v.id AND (c.embedding_config_hash<>$7 OR c.embedding_dimension<>768))
    AND EXISTS(SELECT 1 FROM business_lock) FOR UPDATE
    ), document_cas AS (
    UPDATE knowledge_document SET active_version_id=$2,revision=revision+1 WHERE id=$3 AND business_id=$1 AND revision=$4 AND EXISTS(SELECT 1 FROM guard) RETURNING id
    ), prior AS (
    UPDATE knowledge_version SET is_active=false WHERE document_id=$3 AND id<>$2 AND is_active AND EXISTS(SELECT 1 FROM document_cas) RETURNING id
    ), retired AS (
    UPDATE product_alias a SET status='RETIRED',ambiguous=false WHERE a.business_id=$1 AND a.source_document_version_id<>$2 AND a.source_document_version_id IN (SELECT id FROM knowledge_version WHERE document_id=$3)
    AND a.status::text IN ('ACTIVE') AND EXISTS(SELECT 1 FROM guard) RETURNING a.id
    ), eligible AS MATERIALIZED (
    SELECT a.product_id,a.normalized FROM product_alias a JOIN product p ON p.id=a.product_id AND p.business_id=$1
    JOIN knowledge_version v ON v.id=a.source_document_version_id JOIN knowledge_document d ON d.id=v.document_id
    WHERE a.business_id=$1 AND a.salon_id IS NULL AND v.business_id=$1 AND d.business_id=$1 AND ((v.id=$2) OR (v.document_id<>$3 AND v.is_active AND v.published_at IS NOT NULL AND v.revoked_at IS NULL AND v.status::text='READY' AND v.publication_status::text='DEMO_CURRENT' AND d.active_version_id=v.id)) AND (a.status::text='ACTIVE' OR (v.id=$2 AND a.status::text='PROPOSED' AND a.reviewed_at IS NOT NULL))
    ), activated AS (
    UPDATE product_alias a SET status='ACTIVE',ambiguous=CASE WHEN a.kind::text='NAME' THEN (SELECT count(DISTINCT e.product_id)>1 FROM eligible e WHERE e.normalized=a.normalized) ELSE false END
    WHERE a.business_id=$1 AND a.source_document_version_id=$2 AND a.status::text='PROPOSED' AND a.reviewed_at IS NOT NULL AND EXISTS(SELECT 1 FROM guard) RETURNING a.id
    ), collisions AS (
    UPDATE product_alias a SET ambiguous=(SELECT count(DISTINCT e.product_id)>1 FROM eligible e WHERE e.normalized=a.normalized)
    WHERE a.business_id=$1 AND a.source_document_version_id<>$2 AND a.kind::text='NAME' AND a.status::text='ACTIVE'
    AND a.id NOT IN (SELECT id FROM retired) AND EXISTS(SELECT 1 FROM guard) RETURNING a.id
    ), projection AS (
    UPDATE product p SET type=COALESCE((SELECT kp.approved_type FROM knowledge_product_profile kp JOIN knowledge_version v ON v.id=kp.version_id JOIN knowledge_document d ON d.id=v.document_id WHERE kp.product_id=p.id AND kp.business_id=$1 AND kp.approved_type IS NOT NULL AND kp.reviewed_at IS NOT NULL AND v.business_id=$1 AND d.business_id=$1 AND ((v.id=$2) OR (v.document_id<>$3 AND v.is_active AND v.published_at IS NOT NULL AND v.revoked_at IS NULL AND v.status::text='READY' AND v.publication_status::text='DEMO_CURRENT' AND d.active_version_id=v.id)) ORDER BY CASE WHEN v.id=$2 THEN transaction_timestamp() ELSE v.published_at END DESC,v.id DESC LIMIT 1),p.seed_type),type_source_version_id=(SELECT kp.version_id FROM knowledge_product_profile kp JOIN knowledge_version v ON v.id=kp.version_id JOIN knowledge_document d ON d.id=v.document_id WHERE kp.product_id=p.id AND kp.business_id=$1 AND kp.approved_type IS NOT NULL AND kp.reviewed_at IS NOT NULL AND v.business_id=$1 AND d.business_id=$1 AND ((v.id=$2) OR (v.document_id<>$3 AND v.is_active AND v.published_at IS NOT NULL AND v.revoked_at IS NULL AND v.status::text='READY' AND v.publication_status::text='DEMO_CURRENT' AND d.active_version_id=v.id)) ORDER BY CASE WHEN v.id=$2 THEN transaction_timestamp() ELSE v.published_at END DESC,v.id DESC LIMIT 1)
    WHERE p.business_id=$1 AND p.id IN (SELECT kp.product_id FROM knowledge_product_profile kp JOIN knowledge_version v ON v.id=kp.version_id WHERE v.document_id=$3 AND kp.business_id=$1)
    AND EXISTS(SELECT 1 FROM guard) RETURNING p.id
    )
    UPDATE knowledge_version SET published_at=transaction_timestamp(),is_active=true,pending_stage=NULL,pending_document_revision=NULL,pending_extraction_hash=NULL,
    pending_product_knowledge_reviewed_hash=NULL,pending_product_knowledge_revision=NULL,pending_product_knowledge_catalog_revision=NULL,processing_error=NULL,revision=revision+1
    WHERE id=$2 AND EXISTS(SELECT 1 FROM document_cas) AND (SELECT count(*) FROM prior)>=0 AND (SELECT count(*) FROM retired)>=0 AND (SELECT count(*) FROM activated)>=0 AND (SELECT count(*) FROM collisions)>=0 AND (SELECT count(*) FROM projection)>=0
    """
    params: [
      $businessId
      $versionId
      $documentId
      $expectedDocumentRevision
      $versionRevision
      $extractionHash
      $configHash
    ]
  ) @check(expr: "this == 1", message: "STALE_STATE")
}
