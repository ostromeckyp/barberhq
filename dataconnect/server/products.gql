# HQ product administration. Server-only; every write rechecks the HQ member and derives the business.
query ReadProductAdmin($uid: String!, $productId: String!) @auth(level: NO_ACCESS) {
  rows: _select(
    sql: """
    SELECT p.id,p.demo_id AS "demoId",p.name,p.brand,p.category,COALESCE(p.seed_type,p.type) AS type,
    p.summary_en AS summary,p.scent_pl AS scent,p.net_content_ml AS "netContentMl",
    p.retail_price_grosz AS "retailPriceGrosz",p.source_code AS "sourceCode",p.source_url AS "sourceUrl",
    p.observed_on::text AS "observedOn",COALESCE(i.on_hand,0) AS "onHand",COALESCE(i.reserved,0) AS reserved,
    COALESCE(i.version,0) AS version,p.admin_revision AS revision,b.product_knowledge_revision AS "catalogRevision"
    FROM membership m JOIN business b ON b.id=m.business_id
    JOIN product p ON p.business_id=m.business_id AND p.id=$2
    JOIN location l ON l.business_id=m.business_id AND l.kind::text='HQ'
    LEFT JOIN inventory i ON i.location_id=l.id AND i.product_id=p.id
    WHERE m.uid=$1 AND m.role::text='HQ' LIMIT 1
    """
    params: [$uid, $productId]
  )
}
query ReadProductAdminScope($uid: String!) @auth(level: NO_ACCESS) {
  membership(key: { uid: $uid }) {
    role
    businessId
  }
}
query ReadProductCodeOwner($uid: String!, $sourceCode: String!) @auth(level: NO_ACCESS) {
  rows: _select(
    sql: """
    SELECT p.id FROM membership m JOIN product p ON p.business_id=m.business_id AND p.source_code=$2
    WHERE m.uid=$1 AND m.role::text='HQ' LIMIT 2
    """
    params: [$uid, $sourceCode]
  )
}
query ReadProductAdminOperation($uid: String!, $key: String!) @auth(level: NO_ACCESS) {
  productAdminOperations(
    where: { actorUid: { eq: $uid }, idempotencyKey: { eq: $key } }
    limit: 2
  ) {
    action
    payloadHash
    result
  }
}
mutation CreateProductAdmin(
  $uid: String!
  $productId: String!
  $demoId: String!
  $formJson: String!
  $hqOnHand: Int!
  $operationId: String!
  $key: String!
  $payloadHash: String!
) @auth(level: NO_ACCESS) @transaction {
  result: _execute(
    sql: """
    WITH actor AS MATERIALIZED (SELECT uid,business_id FROM membership WHERE uid=$1 AND role::text='HQ' FOR SHARE),
    f AS MATERIALIZED (SELECT $4::jsonb AS v),
    biz AS (
    UPDATE business b SET product_knowledge_revision=b.product_knowledge_revision+1 FROM actor a
    WHERE b.id=a.business_id AND b.product_knowledge_revision<2147483647 RETURNING b.id
    ), ins AS (
    INSERT INTO product(id,business_id,demo_id,name,brand,category,summary_en,scent_pl,source_code,net_content_ml,
    retail_price_grosz,source_url,observed_on,seed_type,type,hq_updated_at,hq_updated_by)
    SELECT $2,a.business_id,$3,f.v->>'name',f.v->>'brand',f.v->>'category',f.v->>'summary',f.v->>'scent',f.v->>'sourceCode',
    (f.v->>'netContentMl')::int,(f.v->>'retailPriceGrosz')::int,f.v->>'sourceUrl',(f.v->>'observedOn')::date,
    f.v->>'type',f.v->>'type',transaction_timestamp(),$1
    FROM actor a,f WHERE EXISTS(SELECT 1 FROM biz)
    AND NOT EXISTS(SELECT 1 FROM product p WHERE p.business_id=a.business_id AND p.source_code=f.v->>'sourceCode')
    RETURNING id,business_id
    ), inv AS (
    INSERT INTO inventory(location_id,product_id,on_hand,reserved,version)
    SELECT l.id,i.id,CASE WHEN l.kind::text='HQ' THEN $5 ELSE 0 END,0,1
    FROM ins i JOIN location l ON l.business_id=i.business_id RETURNING location_id
    )
    INSERT INTO product_admin_operation(id,business_id,actor_uid,idempotency_key,action,payload_hash,result,created_at)
    SELECT $6,i.business_id,$1,$7,'CREATE',$8,jsonb_build_object('productId',i.id),transaction_timestamp()
    FROM ins i WHERE (SELECT count(*) FROM inv)>=1
    """
    params: [$uid, $productId, $demoId, $formJson, $hqOnHand, $operationId, $key, $payloadHash]
  ) @check(expr: "this == 1", message: "STALE_STATE")
}
mutation UpdateProductAdmin(
  $uid: String!
  $productId: String!
  $expectedRevision: Int!
  $formJson: String!
  $operationId: String!
  $key: String!
  $payloadHash: String!
) @auth(level: NO_ACCESS) @transaction {
  result: _execute(
    sql: """
    WITH actor AS MATERIALIZED (SELECT uid,business_id FROM membership WHERE uid=$1 AND role::text='HQ' FOR SHARE),
    f AS MATERIALIZED (SELECT $4::jsonb AS v),
    biz AS (
    UPDATE business b SET product_knowledge_revision=b.product_knowledge_revision+1 FROM actor a
    WHERE b.id=a.business_id AND b.product_knowledge_revision<2147483647 RETURNING b.id
    ), upd AS (
    UPDATE product p SET name=f.v->>'name',brand=f.v->>'brand',category=f.v->>'category',summary_en=f.v->>'summary',
    scent_pl=f.v->>'scent',source_code=f.v->>'sourceCode',net_content_ml=(f.v->>'netContentMl')::int,
    retail_price_grosz=(f.v->>'retailPriceGrosz')::int,source_url=f.v->>'sourceUrl',observed_on=(f.v->>'observedOn')::date,
    seed_type=f.v->>'type',type=CASE WHEN p.type_source_version_id IS NULL THEN f.v->>'type' ELSE p.type END,
    hq_updated_at=transaction_timestamp(),hq_updated_by=$1,admin_revision=p.admin_revision+1
    FROM actor a,f WHERE p.id=$2 AND p.business_id=a.business_id AND p.admin_revision=$3
    AND p.admin_revision<2147483647 AND EXISTS(SELECT 1 FROM biz)
    AND NOT EXISTS(SELECT 1 FROM product o WHERE o.business_id=a.business_id AND o.id<>$2 AND o.source_code=f.v->>'sourceCode')
    RETURNING p.id,p.business_id
    )
    INSERT INTO product_admin_operation(id,business_id,actor_uid,idempotency_key,action,payload_hash,result,created_at)
    SELECT $5,u.business_id,$1,$6,'UPDATE',$7,jsonb_build_object('productId',u.id),transaction_timestamp() FROM upd u
    """
    params: [$uid, $productId, $expectedRevision, $formJson, $operationId, $key, $payloadHash]
  ) @check(expr: "this == 1", message: "STALE_STATE")
}
mutation SetHqStockAdmin(
  $uid: String!
  $productId: String!
  $expectedVersion: Int!
  $onHand: Int!
  $operationId: String!
  $key: String!
  $payloadHash: String!
  $adjustmentId: String!
) @auth(level: NO_ACCESS) @transaction {
  result: _execute(
    sql: """
    WITH actor AS MATERIALIZED (SELECT uid,business_id FROM membership WHERE uid=$1 AND role::text='HQ' FOR SHARE),
    cur AS MATERIALIZED (
    SELECT i.location_id,i.on_hand,a.business_id FROM inventory i JOIN location l ON l.id=i.location_id AND l.kind::text='HQ'
    JOIN actor a ON a.business_id=l.business_id JOIN product p ON p.id=i.product_id AND p.business_id=a.business_id
    WHERE i.product_id=$2 AND i.version=$3 AND i.reserved<=$4 AND i.version<2147483647 FOR UPDATE OF i
    ), upd AS (
    UPDATE inventory i SET on_hand=$4,version=i.version+1 FROM cur c
    WHERE i.location_id=c.location_id AND i.product_id=$2 RETURNING i.product_id
    ), adj AS (
    INSERT INTO hq_stock_adjustment(id,business_id,product_id,location_id,before,after,actor_uid,created_at)
    SELECT $8,c.business_id,$2,c.location_id,c.on_hand,$4,$1,transaction_timestamp() FROM cur c
    WHERE EXISTS(SELECT 1 FROM upd) RETURNING id
    )
    INSERT INTO product_admin_operation(id,business_id,actor_uid,idempotency_key,action,payload_hash,result,created_at)
    SELECT $5,c.business_id,$1,$6,'SET_HQ_STOCK',$7,jsonb_build_object('productId',$2),transaction_timestamp()
    FROM cur c WHERE EXISTS(SELECT 1 FROM adj)
    """
    params: [
      $uid
      $productId
      $expectedVersion
      $onHand
      $operationId
      $key
      $payloadHash
      $adjustmentId
    ]
  ) @check(expr: "this == 1", message: "STALE_STATE")
}
# Product aliases as HQ sees them: product-owned (HQ), seed, and eligible document rows (read-only).
query ReadProductAliases($uid: String!, $productId: String!) @auth(level: NO_ACCESS) {
  rows: _select(
    sql: """
    SELECT a.id,a.phrase,a.kind::text AS kind,a.revision,
    CASE WHEN a.source::text='SEED' THEN 'SEED' WHEN a.source::text='HQ' AND a.source_document_version_id IS NULL THEN 'HQ' ELSE 'DOCUMENT' END AS source
    FROM membership m JOIN product p ON p.business_id=m.business_id AND p.id=$2
    JOIN product_alias a ON a.product_id=p.id AND a.business_id=m.business_id
    LEFT JOIN knowledge_version v ON v.id=a.source_document_version_id
    LEFT JOIN knowledge_document d ON d.id=v.document_id
    WHERE m.uid=$1 AND m.role::text='HQ' AND a.status::text='ACTIVE' AND a.salon_id IS NULL AND (
    (a.source::text IN ('SEED','HQ') AND a.source_document_version_id IS NULL) OR
    (a.source::text IN ('GENERATED','HQ') AND v.business_id=m.business_id AND d.business_id=m.business_id
    AND v.published_at IS NOT NULL AND v.revoked_at IS NULL AND v.is_active AND v.status::text='READY'
    AND v.publication_status::text='DEMO_CURRENT' AND d.active_version_id=v.id))
    ORDER BY a.id LIMIT 200
    """
    params: [$uid, $productId]
  )
}
query ReadProductAliasRevisions($uid: String!, $productId: String!, $idsJson: String!)
@auth(level: NO_ACCESS) {
  rows: _select(
    sql: """
    SELECT a.id,a.revision,a.status::text AS status FROM membership m JOIN product_alias a ON a.business_id=m.business_id
    WHERE m.uid=$1 AND m.role::text='HQ' AND a.product_id=$2 AND a.id IN (SELECT jsonb_array_elements_text($3::jsonb))
    """
    params: [$uid, $productId, $idsJson]
  )
}
query ReadCollisionProducts($uid: String!) @auth(level: NO_ACCESS) {
  rows: _select(
    sql: """
    SELECT p.id,p.name,p.source_code AS "sourceCode",p.type,p.category,p.summary_en AS "summaryEn",p.scent_pl AS "scentPl",
    COALESCE(to_jsonb(p.keywords),'[]'::jsonb) AS keywords
    FROM membership m JOIN product p ON p.business_id=m.business_id WHERE m.uid=$1 AND m.role::text='HQ'
    ORDER BY p.id LIMIT 201
    """
    params: [$uid]
  )
}
query ReadCollisionAliases($uid: String!) @auth(level: NO_ACCESS) {
  rows: _select(
    sql: """
    SELECT a.id,a.product_id AS "productId",a.phrase,a.normalized,a.kind::text AS kind,a.source::text AS source,
    a.salon_id AS "salonId",a.source_document_version_id AS "sourceVersionId",a.ambiguous,a.revision
    FROM membership m JOIN product_alias a ON a.business_id=m.business_id
    LEFT JOIN knowledge_version v ON v.id=a.source_document_version_id
    LEFT JOIN knowledge_document d ON d.id=v.document_id
    WHERE m.uid=$1 AND m.role::text='HQ' AND a.status::text='ACTIVE' AND a.salon_id IS NULL AND (
    (a.source::text IN ('SEED','HQ') AND a.source_document_version_id IS NULL) OR
    (a.source::text IN ('GENERATED','HQ') AND v.published_at IS NOT NULL AND v.revoked_at IS NULL AND v.is_active
    AND v.status::text='READY' AND v.publication_status::text='DEMO_CURRENT' AND d.active_version_id=v.id))
    ORDER BY a.id LIMIT 5001
    """
    params: [$uid]
  )
}
# One transaction: retire (seed rows become owner-overridden) and upsert product-owned rows under per-alias CAS.
mutation SaveProductAliases(
  $uid: String!
  $productId: String!
  $retiresJson: String!
  $upsertsJson: String!
  $operationId: String!
  $key: String!
  $payloadHash: String!
) @auth(level: NO_ACCESS) @transaction {
  result: _execute(
    sql: """
    WITH actor AS MATERIALIZED (
    SELECT m.uid,m.business_id FROM membership m JOIN product p ON p.business_id=m.business_id AND p.id=$2
    WHERE m.uid=$1 AND m.role::text='HQ' FOR SHARE OF m
    ), biz AS (
    UPDATE business b SET product_knowledge_revision=b.product_knowledge_revision+1 FROM actor a
    WHERE b.id=a.business_id AND b.product_knowledge_revision<2147483647 RETURNING b.id
    ), retired AS (
    UPDATE product_alias x SET status='RETIRED',ambiguous=false,revision=x.revision+1,
    overridden_by_hq=(x.source::text='SEED'),reviewed_by='hq:'||$1,reviewed_at=transaction_timestamp()
    FROM jsonb_array_elements($3::jsonb) r, actor a
    WHERE x.id=r->>'id' AND x.product_id=$2 AND x.business_id=a.business_id AND x.revision=(r->>'expectedRevision')::int
    AND x.status::text='ACTIVE' AND x.source::text IN ('SEED','HQ') AND x.source_document_version_id IS NULL
    AND x.salon_id IS NULL AND x.revision<2147483647 AND EXISTS(SELECT 1 FROM biz) RETURNING x.id,x.source::text AS source
    ), upserted AS (
    INSERT INTO product_alias(id,business_id,product_id,salon_id,phrase,normalized,kind,lang,source,status,ambiguous,
    created_by,created_at,reviewed_by,reviewed_at,revision,overridden_by_hq)
    SELECT u->>'id',a.business_id,$2,NULL,u->>'phrase',u->>'normalized',(u->>'kind')::product_alias_kind,'und','HQ','ACTIVE',false,
    'hq:'||$1,transaction_timestamp(),'hq:'||$1,transaction_timestamp(),(u->>'expectedRevision')::int+1,false
    FROM jsonb_array_elements($4::jsonb) u, actor a
    WHERE (u->>'expectedRevision')::int=COALESCE((SELECT x.revision FROM product_alias x WHERE x.id=u->>'id'),0)
    AND (u->>'id') LIKE 'product-hq:%' AND EXISTS(SELECT 1 FROM biz)
    ON CONFLICT (id) DO UPDATE SET phrase=EXCLUDED.phrase,normalized=EXCLUDED.normalized,kind=EXCLUDED.kind,status='ACTIVE',
    ambiguous=false,reviewed_by=EXCLUDED.reviewed_by,reviewed_at=EXCLUDED.reviewed_at,revision=EXCLUDED.revision
    WHERE product_alias.product_id=$2 AND product_alias.source::text='HQ' AND product_alias.source_document_version_id IS NULL
    AND product_alias.revision=EXCLUDED.revision-1
    RETURNING id
    )
    INSERT INTO product_admin_operation(id,business_id,actor_uid,idempotency_key,action,payload_hash,result,created_at)
    SELECT $5,a.business_id,$1,$6,'ALIASES',$7,jsonb_build_object('productId',$2),transaction_timestamp() FROM actor a
    WHERE (SELECT count(*) FROM retired)=jsonb_array_length($3::jsonb)
    AND (SELECT count(*) FROM upserted)=jsonb_array_length($4::jsonb)
    AND (SELECT count(*) FROM product_alias x WHERE x.product_id=$2 AND x.source::text='HQ' AND x.status::text='ACTIVE'
    AND x.source_document_version_id IS NULL)
    - (SELECT count(*) FROM retired WHERE source='HQ')
    + (SELECT count(*) FROM jsonb_array_elements($4::jsonb) u WHERE NOT EXISTS(
    SELECT 1 FROM product_alias x WHERE x.id=u->>'id' AND x.status::text='ACTIVE')) <= 32
    """
    params: [$uid, $productId, $retiresJson, $upsertsJson, $operationId, $key, $payloadHash]
  ) @check(expr: "this == 1", message: "STALE_STATE")
}
query ReadProductCardAttachment($uid: String!, $productId: String!) @auth(level: NO_ACCESS) {
  rows: _select(
    sql: """
    SELECT c.document_id AS "documentId",c.version_id AS "versionId",c.status,c.suggestions,c.revision,
    d.revision AS "documentRevision",c.updated_at<clock_timestamp()-interval '2 minutes' AS "staleGenerating"
    FROM membership m JOIN product_card_attachment c ON c.business_id=m.business_id AND c.product_id=$2
    LEFT JOIN knowledge_document d ON d.id=c.document_id
    WHERE m.uid=$1 AND m.role::text='HQ' LIMIT 1
    """
    params: [$uid, $productId]
  )
}
mutation SaveProductCardAttachment(
  $uid: String!
  $productId: String!
  $expectedRevision: Int!
  $documentId: String!
  $versionId: String!
  $status: String!
  $suggestionsJson: String!
) @auth(level: NO_ACCESS) @transaction {
  result: _execute(
    sql: """
    WITH actor AS MATERIALIZED (
    SELECT m.business_id FROM membership m JOIN product p ON p.business_id=m.business_id AND p.id=$2
    WHERE m.uid=$1 AND m.role::text='HQ' FOR SHARE OF m
    )
    INSERT INTO product_card_attachment(product_id,business_id,document_id,version_id,status,suggestions,actor_uid,revision,updated_at)
    SELECT $2,a.business_id,$4,$5,$6,$7::jsonb,$1,$3+1,transaction_timestamp() FROM actor a
    WHERE $3=COALESCE((SELECT c.revision FROM product_card_attachment c WHERE c.product_id=$2),0)
    ON CONFLICT (product_id) DO UPDATE SET document_id=EXCLUDED.document_id,version_id=EXCLUDED.version_id,
    status=EXCLUDED.status,suggestions=EXCLUDED.suggestions,actor_uid=EXCLUDED.actor_uid,revision=EXCLUDED.revision,
    updated_at=EXCLUDED.updated_at WHERE product_card_attachment.revision=EXCLUDED.revision-1
    """
    params: [
      $uid
      $productId
      $expectedRevision
      $documentId
      $versionId
      $status
      $suggestionsJson
    ]
  ) @check(expr: "this == 1", message: "STALE_STATE")
}
