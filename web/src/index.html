<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BarberHQ</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#171614" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BarberHQ" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@100..900&family=IBM+Plex+Mono:wght@500&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@0..1&icon_names=abc,account_circle,add,add_shopping_cart,arrow_back,auto_awesome,cancel,check,check_circle,close,dashboard,delete,description,done_all,edit,error,error_outline,folder_open,format_list_bulleted,format_quote,help,hourglass_top,info,inventory_2,language,link,list_alt,local_shipping,lock,logout,menu,notifications,picture_as_pdf,radio_button_unchecked,receipt_long,refresh,remove,report_problem,science,search,search_off,settings,translate,upload_file,visibility,visibility_off,warehouse,warning&display=block"
    />
  </head>
  <body>
    <app-root>
      <style>
        .splash {
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          background: #f6f5f2;
          color: #171614;
        }
        .splash strong {
          font-family: 'Archivo', sans-serif;
          font-size: 28px;
          font-weight: 800;
          letter-spacing: -0.04em;
        }
        .splash-bar {
          position: relative;
          width: 120px;
          height: 3px;
          overflow: hidden;
          background: #e2ded6;
        }
        .splash-bar::after {
          content: '';
          position: absolute;
          inset: 0 auto 0 0;
          width: 40%;
          background: #dc241f;
          animation: splash-slide 1.2s ease-in-out infinite;
        }
        @keyframes splash-slide {
          from {
            transform: translateX(-100%);
          }
          to {
            transform: translateX(300%);
          }
        }
        @media (prefers-reduced-motion: reduce) {
          .splash-bar::after {
            animation: none;
            width: 100%;
          }
        }
      </style>
      <div class="splash">
        <strong>BarberHQ</strong>
        <div class="splash-bar"></div>
      </div>
    </app-root>
  </body>
</html>
