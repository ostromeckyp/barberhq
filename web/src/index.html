<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BarberHQ</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root>
      <style>
        .splash {
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          background: #f6f5f2;
          color: #171614;
        }
        .splash strong {
          font-family: 'Archivo Variable', sans-serif;
          font-size: 28px;
          font-weight: 800;
          letter-spacing: -0.04em;
        }
        .splash-bar {
          position: relative;
          width: 120px;
          height: 3px;
          overflow: hidden;
          background: #e2ded6;
        }
        .splash-bar::after {
          content: '';
          position: absolute;
          inset: 0 auto 0 0;
          width: 40%;
          background: #dc241f;
          animation: splash-slide 1.2s ease-in-out infinite;
        }
        @keyframes splash-slide {
          from {
            transform: translateX(-100%);
          }
          to {
            transform: translateX(300%);
          }
        }
        @media (prefers-reduced-motion: reduce) {
          .splash-bar::after {
            animation: none;
            width: 100%;
          }
        }
      </style>
      <div class="splash">
        <strong>BarberHQ</strong>
        <div class="splash-bar"></div>
      </div>
    </app-root>
  </body>
</html>
