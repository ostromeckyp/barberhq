<app-page-header
  eyebrow="SALON WORKSPACE"
  title="Requests"
  description="Track replenishment from request to receipt."
  ><button mat-stroked-button (click)="facade.refresh()" [disabled]="facade.loading()">
    Refresh
  </button></app-page-header
>
<mat-button-toggle-group
  aria-label="Request status"
  [value]="facade.context().filter"
  (change)="facade.setFilter($event.value)"
>
  <mat-button-toggle value="ALL">All</mat-button-toggle
  ><mat-button-toggle value="ACTIVE">Active</mat-button-toggle
  ><mat-button-toggle value="RECEIVED">Received</mat-button-toggle
  ><mat-button-toggle value="REJECTED">Rejected</mat-button-toggle>
</mat-button-toggle-group>
<mat-progress-bar
  *appDelayedLoading="facade.loading()"
  mode="indeterminate"
  aria-label="Loading requests"
/>
@if (!facade.loading()) {
  @if (facade.error()) {
    <p role="alert">
      Requests unavailable. <button mat-button (click)="facade.refresh()">Retry</button>
    </p>
  } @else {
    <app-request-list [requests]="facade.items()" [context]="facade.context()" />
  }
}
<nav aria-label="Request pages">
  <button
    mat-button
    [disabled]="facade.context().offset === 0 || facade.loading()"
    (click)="facade.goToPage(facade.context().offset - 50)"
  >
    Previous</button
  ><button
    mat-button
    [disabled]="facade.nextOffset() === null || facade.loading()"
    (click)="facade.goToPage(facade.nextOffset()!)"
  >
    Next
  </button>
</nav>
