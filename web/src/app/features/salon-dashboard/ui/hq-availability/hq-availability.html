<section class="inventory-card" aria-labelledby="hq-heading">
  <header class="card-heading">
    <h2 id="hq-heading"><mat-icon>warehouse</mat-icon>HQ availability</h2>
  </header>
  <div class="table-scroll" role="region" aria-label="HQ availability table" tabindex="0">
    <table mat-table [dataSource]="rows()" aria-label="HQ availability">
      <ng-container matColumnDef="product">
        <th mat-header-cell *matHeaderCellDef>Product</th>
        <td mat-cell *matCellDef="let row">
          <strong>{{ row.productName }}</strong>
          <small>{{ row.netContent.value }} {{ row.netContent.unit }}</small>
        </td>
      </ng-container>
      <ng-container matColumnDef="quantity">
        <th mat-header-cell *matHeaderCellDef>Available at HQ</th>
        <td mat-cell *matCellDef="let row" class="quantity-cell">
          <strong>{{ row.hqAvailable }}</strong
          ><small>available</small>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
  </div>
  <footer class="card-footer">
    <mat-icon>info</mat-icon>Available quantities exclude reserved units.
  </footer>
</section>
